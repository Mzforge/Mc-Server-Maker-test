<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070D18">
<title>MZForge — free Minecraft servers that run on your own PC</title>
<meta name="description" content="Create a Minecraft Java server in a minute, no account needed. It runs on your PC, so there's no queue and no player cap. We give it an address your friends can join.">
<link rel="icon" type="image/png" href="logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Palette sampled from the MZForge logo: dark forge, blue-grey stone,
     ice-cyan glow, ember banners. */
  --bg: #070D18;
  --surface: #0F1826;
  --raised: #182436;
  --line: #26364E;
  --text: #E7EEF6;
  --muted: #8D9BB0;
  --glow: #2FD8FF;
  --glow-soft: rgba(47,216,255,.16);
  --glow-ink: #021018;
  --warn: #F2B544;
  --online: #63DB6A;
  --danger: #E8553A;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 6px;
  --measure: 68ch;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
details > summary.label { list-style: none; }
details > summary.label::-webkit-details-marker { display: none; }
details > summary.label::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--glow); }
details[open] > summary.label::before { content: "▾"; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body {
  margin: 0; color: var(--text);
  background: radial-gradient(1200px 600px at 80% -10%, rgba(47,216,255,.08), transparent 60%), var(--bg);
  background-attachment: fixed;
  font: 17px/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0 0 .5em; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 5.2vw, 3.4rem); font-weight: 700; }
h2 { font-size: clamp(1.45rem, 3vw, 1.9rem); }
h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; max-width: var(--measure); }
a { color: var(--glow); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code { font-family: var(--display); font-weight: 600; }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { position: fixed; left: 12px; top: 12px; width: auto; height: auto; clip: auto; z-index: 100; background: var(--glow); color: var(--glow-ink); padding: 8px 12px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 720px; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

/* header */
.top { position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top, 0px); background: rgba(7,13,24,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 1.2rem var(--display); color: var(--text); text-decoration: none; margin-right: auto; }
.brand-mark { width: 34px; height: 34px; border-radius: 6px; filter: drop-shadow(0 0 6px rgba(47,216,255,.45)); }
.nav { display: flex; gap: 4px; align-items: center; }
.nav a { white-space: nowrap; }
.nav a:not(.btn) { color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: var(--r); font-family: var(--display); font-weight: 600; }
.nav a:not(.btn):hover, .nav a[aria-current="page"] { color: var(--text); background: var(--surface); }

/* buttons */
.btn {
  --b: var(--raised); --c: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--r);
  background: var(--b); color: var(--c); font: 600 1rem var(--display);
  text-decoration: none; cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { box-shadow: inset 0 2px 0 rgba(0,0,0,.3); transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.primary { --b: var(--glow); --c: var(--glow-ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25), 0 0 18px rgba(47,216,255,.28); }
.btn.danger { --b: var(--danger); --c: #1E0600; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .92rem; }
.btn.block { width: 100%; }

main { flex: 1; padding: 40px 0 80px; }
main:focus { outline: none; }

/* The join-address plate: the most important thing on the site.
   Styled like an inventory slot: light top-left bevel, dark bottom-right. */
.plate {
  background: var(--surface); border-radius: 4px; padding: 20px;
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.07), inset -3px -3px 0 rgba(0,0,0,.35), 0 0 0 1px var(--line);
}
.plate-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.plate-caption { color: var(--muted); font-size: .95rem; }
.addr-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.addr {
  flex: 1 1 320px; min-width: 0;
  background: var(--bg); border-radius: 3px; padding: 14px 16px;
  box-shadow: inset 3px 3px 0 rgba(0,0,0,.45), inset -2px -2px 0 rgba(255,255,255,.05);
  font: 700 clamp(1.15rem, 3.6vw, 2.1rem)/1.2 var(--display); color: var(--text);
  overflow-wrap: break-word; user-select: all; letter-spacing: .01em;
}
.plate.big .addr { font-size: clamp(1.3rem, 5vw, 2.7rem); padding: 20px; }
.addr-row .btn { min-width: 112px; min-height: 56px; }
.plate-foot { margin: 14px 0 0; font-size: .92rem; color: var(--muted); }
.plate-foot code { color: var(--text); overflow-wrap: anywhere; }

/* status */
.status { display: inline-flex; align-items: center; gap: 8px; font: 600 .95rem var(--display); }
.dot { width: 10px; height: 10px; border-radius: 2px; background: var(--muted); flex: none; }
.status.online { color: var(--online); } .status.online .dot { background: var(--online); box-shadow: 0 0 0 4px rgba(99,219,106,.18); }
.status.offline { color: var(--muted); }
.status.never_started { color: var(--warn); } .status.never_started .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--warn); }

/* landing */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; padding: 24px 0 72px; }
.hero h1 { max-width: 14ch; }
.hero .lede { font-size: 1.2rem; color: var(--muted); max-width: 44ch; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.demo .plate { transform: rotate(-1.2deg); }
.demo .addr { font-size: clamp(1.1rem, 2.3vw, 1.55rem); flex-basis: 100%; }
.demo .addr-row .btn { display: none; }
.demo-chat { margin: 18px 0 0 auto; max-width: 300px; background: var(--raised); border-radius: 14px 14px 4px 14px; padding: 12px 14px; font-size: .95rem; transform: rotate(1deg); }
.demo-chat b { font-family: var(--display); color: var(--glow); }
.section { padding: 56px 0; border-top: 1px solid var(--line); }
.steps { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; counter-reset: s; }
.steps li { counter-increment: s; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 14px; font: 700 1.2rem var(--display); color: var(--glow-ink); background: var(--glow); border-radius: 4px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.25); }
.steps p { color: var(--muted); font-size: .98rem; }
.tradeoff { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 12px; }
.tradeoff ul { padding-left: 1.1em; margin: 0; }
.tradeoff li { margin-bottom: .7em; max-width: 48ch; }
.tradeoff li::marker { color: var(--glow); }
.tradeoff .needs li::marker { color: var(--muted); }

/* forms */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
.field { margin-bottom: 18px; }
.field label, .label { display: block; font: 600 .95rem var(--display); margin-bottom: 6px; }
.hint { color: var(--muted); font-size: .88rem; margin-top: 6px; }
input[type=text], input[type=email], input[type=password], input[type=search], select {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r);
  background: var(--bg); color: var(--text); border: 1px solid var(--line); font: 1rem var(--body);
}
input:focus, select:focus { border-color: var(--glow); outline: none; box-shadow: 0 0 0 3px rgba(47,216,255,.3); }
.slug-input { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); overflow: hidden; }
.slug-input:focus-within { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(47,216,255,.3); }
.slug-input input { border: 0; box-shadow: none !important; min-width: 0; }
.slug-input span { display: flex; align-items: center; padding: 0 12px; color: var(--muted); background: var(--surface); white-space: nowrap; font: 600 1rem var(--display); }
.addr-preview { margin-top: 10px; font-size: .95rem; color: var(--muted); }
.addr-preview code { color: var(--text); font-size: 1.05rem; overflow-wrap: break-word; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--glow); flex: none; }
.alert { padding: 12px 14px; border-radius: var(--r); margin-bottom: 18px; font-size: .95rem; }
.alert.error { background: rgba(238,106,95,.12); color: #FFB3AC; box-shadow: inset 3px 0 0 var(--danger); }
.alert.info { background: var(--glow-soft); box-shadow: inset 3px 0 0 var(--glow); }
.alert.ok { background: rgba(99,219,106,.1); box-shadow: inset 3px 0 0 var(--online); }
.ok-text { color: var(--online); } .bad-text { color: #FFB3AC; }
.form-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; font-size: .95rem; }

/* dashboard */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.page-head h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0; }
.server-list { display: grid; gap: 14px; }
.server-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
}
.server-row h2 { font-size: 1.25rem; margin: 0; overflow-wrap: anywhere; }
.server-row h2 a { color: var(--text); text-decoration: none; }
.server-row h2 a:hover { color: var(--glow); }
.server-row .meta { color: var(--muted); font-size: .9rem; }
.row-addr { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-addr code { font-size: 1.05rem; color: var(--text); background: var(--bg); padding: 8px 12px; border-radius: 4px; overflow-wrap: anywhere; flex: 1 1 260px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.row-note { grid-column: 1 / -1; }
.empty { padding: 40px; border: 2px dashed var(--line); border-radius: 10px; }

/* wizard */
.wizard-steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 28px; }
.wizard-steps li { flex: 1; font: 600 .82rem var(--display); color: var(--muted); padding-top: 10px; border-top: 4px solid var(--line); }
.wizard-steps li[aria-current="step"] { color: var(--text); border-color: var(--glow); }
.wizard-steps li.done { border-color: rgba(47,216,255,.45); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; }
.choice label { display: block; height: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
.choice label b { display: block; font: 700 1.1rem var(--display); margin-bottom: 4px; }
.choice label span { color: var(--muted); font-size: .9rem; }
.choice input:checked + label { border-color: var(--glow); box-shadow: inset 0 0 0 1px var(--glow); }
.choice input:focus-visible + label { outline: 3px solid var(--glow); outline-offset: 2px; }
.eula-box { max-height: 280px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; font-size: .92rem; white-space: pre-wrap; margin-bottom: 16px; }
.review { display: grid; grid-template-columns: max-content 1fr; gap: 10px 24px; margin: 0 0 20px; }
.review dt { color: var(--muted); } .review dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.wizard-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }

/* server page */
.server-top h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 18px; overflow-wrap: anywhere; }
.status-line { margin: 14px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 28px 0; padding: 0; list-style: none; color: var(--muted); font-size: .95rem; }
.facts b { color: var(--text); }
.panel { margin-top: 44px; }
.panel h2 { font-size: 1.3rem; }
details.panel summary { cursor: pointer; }
.setup { list-style: none; padding: 0; margin: 0; counter-reset: k; }
.setup > li { counter-increment: k; position: relative; padding: 0 0 22px 52px; }
.setup > li::before { content: counter(k); position: absolute; left: 0; top: -2px; width: 34px; height: 34px; display: grid; place-items: center; font: 700 1rem var(--display); background: var(--raised); color: var(--glow); border-radius: 4px; }
.setup > li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 38px; bottom: 4px; width: 2px; background: var(--line); }
.setup h3 { margin: 4px 0 6px; }
.setup p { color: var(--muted); }
.keybox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.keybox.fresh { margin-top: 36px; border-color: var(--glow); box-shadow: inset 4px 0 0 var(--glow); }
.keybox h2 { font-size: 1.3rem; }
.keybox input { font-family: var(--display); font-size: .92rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--glow); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.row-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.expiry { font: 600 .85rem var(--display); color: var(--muted); }
.expiry.warn { color: var(--warn); }
.expiry.expired { color: var(--danger); }
.alert.warn { background: rgba(242,181,68,.12); box-shadow: inset 3px 0 0 var(--warn); }
.row-note.alert { margin: 6px 0 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.renew-bar { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 18px 0 0; padding: 14px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.renew-bar p { margin: 0; }
.renew-bar.warn { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.renew-bar.expired { border-color: var(--danger); box-shadow: inset 4px 0 0 var(--danger); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 28px 0 28px; overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font: 600 1rem var(--display); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--glow); }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.motd-preview { margin-top: 10px; background: #1b1b1b; border-radius: 4px; padding: 10px 12px; font: 16px/1.35 "Minecraft", "Consolas", monospace; color: #aaa; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: inset 2px 2px 0 rgba(0,0,0,.6); }
.motd-preview .t { color: #fff; display: block; margin-bottom: 2px; }
.toggle-row { display: flex; gap: 24px; flex-wrap: wrap; }
.mod-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.mod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.mod img, .mod .noicon { width: 44px; height: 44px; border-radius: 6px; background: var(--raised); object-fit: cover; }
.mod b { font-family: var(--display); display: block; overflow-wrap: anywhere; }
.mod .meta { color: var(--muted); font-size: .88rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.search-row { display: flex; gap: 10px; margin: 8px 0 16px; }
.search-row input { flex: 1; }
@media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } .row-status { align-items: flex-start; } }
/* ---- wizard / settings layout ---- */
.wiz-title { font-size: clamp(1.8rem, 4vw, 2.4rem); }
.wiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.wiz-layout > .card, .wiz-layout > div > .card { border-radius: 14px; }
.card h2 { font-size: 1.45rem; }
.card h2.panel { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--line); }
#preview-slot { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.steps-nav { list-style: none; display: flex; gap: 8px; padding: 0; margin: 0 0 22px; overflow-x: auto; scrollbar-width: none; }
.steps-nav button { display: flex; align-items: center; gap: 10px; white-space: nowrap; padding: 8px 14px 8px 8px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); font: 600 .95rem var(--display); cursor: pointer; }
.steps-nav button[disabled] { cursor: default; opacity: .7; }
.steps-nav .num { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--raised); color: var(--muted); font-size: .85rem; }
.steps-nav button.done .num { background: var(--online); color: #04160a; }
.steps-nav button[aria-current="step"] { color: var(--text); border-color: var(--glow); background: linear-gradient(180deg, var(--glow-soft), transparent); }
.steps-nav button[aria-current="step"] .num { background: var(--glow); color: var(--glow-ink); }
.preview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 0 40px rgba(47,216,255,.06); }
.preview-title { font: 600 .78rem var(--display); letter-spacing: .08em; color: var(--muted); text-align: center; margin-bottom: 12px; }
.mc-entry { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: #0c0c0c; border: 2px solid #3a3a3a; padding: 6px; font-family: "Consolas", "Courier New", monospace; }
.mc-entry img { width: 64px; height: 64px; image-rendering: pixelated; }
.mc-name { color: #fff; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mc-motd { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.mc-count { color: #aaa; font-size: 13px; }
.preview-rows { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 16px 0 12px; font-size: .92rem; }
.preview-rows dt { color: var(--muted); } .preview-rows dd { margin: 0; text-align: right; font-weight: 700; text-transform: capitalize; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); font: 600 .85rem var(--display); }
.chip button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; }
.chip button:hover { color: var(--danger); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 10px; }
.names .inline-form { max-width: 380px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 42px; padding: 0 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); font: 600 .95rem var(--display); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-checked="true"] { border-color: var(--glow); background: var(--glow-soft); box-shadow: inset 0 0 0 1px var(--glow); }
.rec { font: 700 .68rem var(--display); letter-spacing: .02em; color: var(--glow-ink); background: var(--glow); padding: 2px 6px; border-radius: 4px; }
.custom-ram { margin-top: 10px; display: flex; align-items: center; gap: 8px; } .custom-ram input { max-width: 110px; }
.warn-text { color: var(--warn); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.swatches button { width: 34px; height: 34px; border-radius: 8px; background: var(--sw); border: 2px solid transparent; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); cursor: pointer; }

<body>
<a class="sr-only skip" href="#app">Skip to content</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><img class="brand-mark" src="logo-64.png" alt="" width="34" height="34">MZForge</a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer>
  <div class="wrap">
    <span>MZForge is not affiliated with Mojang or Microsoft. Minecraft is a trademark of Mojang Synergies AB.</span>
    <span><a href="#/help">Help</a></span>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// Where the MZForge API lives. "" = same origin (the API serves this page).
// If you host this file somewhere else, set it to e.g. "https://api.mzforge.com".
const API = "";

const LOADERS = {
  vanilla: { name: "Vanilla", blurb: "The game exactly as Mojang ships it." },
  paper:   { name: "Paper",   blurb: "Faster, and runs Bukkit and Paper plugins." },
  fabric:  { name: "Fabric",  blurb: "Lightweight, for Fabric mods." },
};

const $app = document.getElementById("app");
const state = { timers: [] };
const $ = id => document.getElementById(id);

// ---------- servers saved on this device ----------
// There are no accounts. Each server has a secret manage key; this browser
// remembers the ones created or opened here. The same link is in the
// README.txt inside every download, so it's never only stored here.
const STORE_KEY = "mzforge.servers.v1";
function saved() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function saveAll(list) { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch {} }
function remember(id, key, name) { const l = saved().filter(x => x.id !== id); l.unshift({ id, key, name }); saveAll(l); }
function forget(id) { saveAll(saved().filter(x => x.id !== id)); }
function keyFor(id) { return saved().find(x => x.id === id)?.key || ""; }
function manageURL(id, key) { return `${location.origin}${location.pathname}#/manage/${id}/${key}`; }
function shareURL(id) { return `${location.origin}${location.pathname}#/s/${id}`; }

// ---------- helpers ----------
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// Break long hostnames after dots so they wrap cleanly on phones.
function addrHTML(host) { return esc(host).replace(/\./g, ".<wbr>"); }

async function api(method, path, body, key) {
  const opts = { method, headers: {} };
  if (key) opts.headers["X-Manage-Key"] = key;
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { throw new Error("Can't reach MZForge right now. Check your connection and try again."); }
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch { /* not JSON */ }
  if (!res.ok) {
    // No JSON body on a 404/405 means something other than the MZForge API
    // answered, e.g. this file is being served by a static host.
    const msg = data?.error ? sentence(data.error)
      : [404, 405, 501].includes(res.status)
        ? "This page can't reach the MZForge API. Open the site through the API server, or set API at the top of index.html."
        : `Request failed (${res.status}).`;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return data;
}
function sentence(s) { return s ? s[0].toUpperCase() + s.slice(1) + (/[.!?]$/.test(s) ? "" : ".") : s; }

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2000);
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(label || "Copied");
}
function ago(iso) {
  if (!iso || iso.startsWith("0001")) return null;
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const h = Math.round(s / 3600); if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(s / 86400); if (d < 30) return `${d} day${d === 1 ? "" : "s"} ago`;
  return new Date(iso).toLocaleDateString();
}
function dateStr(iso) { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
function loaderName(l) { return LOADERS[l]?.name || "Minecraft"; }
function every(ms, fn) {
  const id = setInterval(() => { if (document.visibilityState === "visible") fn(); }, ms);
  state.timers.push(id);
}
// ---------- building the download ----------
// The launcher exe is a static file next to this page; the API sends the
// server's config files, and the ZIP is put together here in the browser.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// Minimal ZIP writer (stored, no compression; the exe barely compresses anyway).
function makeZip(entries) {
  const enc = new TextEncoder(), d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const { name, data } of entries) {
    const nameBytes = enc.encode(name), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2], [14, crc, 4],
     [18, data.length, 4], [22, data.length, 4], [26, nameBytes.length, 2], [28, 0, 2]]
      .forEach(([o, v, n]) => n === 4 ? local.setUint32(o, v, true) : local.setUint16(o, v, true));
    parts.push(local, nameBytes, data);
    const cen = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2], [16, crc, 4],
     [20, data.length, 4], [24, data.length, 4], [28, nameBytes.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2],
     [36, 0, 2], [38, 0, 4], [42, offset, 4]]
      .forEach(([o, v, n]) => n === 4 ? cen.setUint32(o, v, true) : cen.setUint16(o, v, true));
    central.push(cen, nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const cdSize = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, entries.length, 2], [10, entries.length, 2], [12, cdSize, 4], [16, offset, 4], [20, 0, 2]]
    .forEach(([o, v, n]) => n === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}
let launcherBytes = null;
async function sha512Hex(bytes) {
  const d = await crypto.subtle.digest("SHA-512", bytes);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}
// progress(text) is called as files are fetched, for button labels.
async function saveDownload(dl, progress = () => {}) {
  if (!launcherBytes) {
    progress("Getting launcher…");
    let res;
    try { res = await fetch("MZForgeLauncher.exe"); } catch { res = null; }
    if (!res || !res.ok) throw new Error("Couldn't load MZForgeLauncher.exe. Check it's in the same folder as index.html on the site.");
    launcherBytes = new Uint8Array(await res.arrayBuffer());
  }
  const enc = new TextEncoder();
  const entries = Object.entries(dl.files).map(([name, text]) => ({ name, data: enc.encode(text) }));
  entries.push({ name: "MZForgeLauncher.exe", data: launcherBytes });
  // server-icon.png: the server's own icon, or the MZForge default.
  try {
    const icon = dl.icon_png ? Uint8Array.from(atob(dl.icon_png), c => c.charCodeAt(0))
      : new Uint8Array(await (await fetch(DEFAULT_ICON)).arrayBuffer());
    entries.push({ name: "server-icon.png", data: icon });
  } catch { /* the launcher still works without an icon */ }
  // Mods/plugins: fetched via the API (Modrinth's CDN only) and checked
  // against Modrinth's SHA-512 before going in the ZIP.
  const failed = [];
  for (const [i, m] of (dl.mods || []).entries()) {
    progress(`Adding ${dl.mods_folder} ${i + 1} of ${dl.mods.length}…`);
    try {
      const res = await fetch(API + "/modfile?url=" + encodeURIComponent(m.url));
      if (!res.ok) throw new Error();
      const bytes = new Uint8Array(await res.arrayBuffer());
      if (m.sha512 && (await sha512Hex(bytes)) !== m.sha512) throw new Error();
      entries.push({ name: `${dl.mods_folder}/${m.filename}`, data: bytes });
    } catch { failed.push(m.title); }
  }
  if (failed.length) toast(`Couldn't include ${failed.join(", ")}. The launcher will download ${failed.length === 1 ? "it" : "them"} when it starts.`);
  const url = URL.createObjectURL(makeZip(entries));
  const a = document.createElement("a");
  a.href = url; a.download = dl.filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function slugify(s) { return s.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32).replace(/-+$/, ""); }
function setTitle(t) { document.title = t ? `${t} — MZForge` : "MZForge — free Minecraft servers that run on your own PC"; }
function busy(btn, on, text) { btn.disabled = on; if (text) btn.textContent = text; }
function formError(msg) {
  const el = $("err"); if (!el) return;
  el.innerHTML = msg ? `<div class="alert error" role="alert">${esc(msg)}</div>` : "";
}

function statusInfo(sv) {
  const last = ago(sv.last_seen);
  const map = {
    online: ["Online", "Friends can join now."],
    offline: ["Offline", last ? `Last online ${last}. It comes back when MZForgeLauncher.exe is running on the host PC.` : "Not running right now."],
    never_started: ["Not started yet", "Run MZForgeLauncher.exe on your PC to bring it online."],
  };
  const [label, detail] = map[sv.status] || ["Checking", ""];
  return { badge: `<span class="status ${esc(sv.status)}"><span class="dot" aria-hidden="true"></span>${label}</span>`, detail };
}

// Expiry: the address is held 30 days at a time; running the server or
// clicking Renew restarts the count.
function expiryInfo(sv) {
  if (!sv.expires_at) return null;
  const d = sv.days_left, date = dateStr(sv.expires_at);
  if (sv.expired) return { level: "expired", short: "Expired", text: `This server's 30 days ran out. It will be removed and its address freed within a day unless you renew it now.` };
  const days = `${d} day${d === 1 ? "" : "s"}`;
  if (d < 7) return { level: "warn", short: `Expires in ${days}`, text: `Expires in ${days} (${date}). Click Renew to extend, or just run the server: that renews it too.` };
  return { level: "ok", short: `${d} days left`, text: `Address held until ${date}. Running the server renews it automatically.` };
}
function expiryBadge(sv) {
  const e = expiryInfo(sv);
  return e ? `<span class="expiry ${e.level}">${esc(e.short)}</span>` : "";
}

function plateHTML(sv, { big = false, caption = "Your friends join at", demo = false } = {}) {
  return `
  <section class="plate ${big ? "big" : ""}" aria-label="Join address">
    <div class="plate-head"><span class="plate-caption">${esc(caption)}</span>${statusInfo(sv).badge}</div>
    <div class="addr-row">
      <div class="addr">${addrHTML(sv.hostname)}</div>
      <button class="btn primary" ${demo ? "" : `data-copy="${esc(sv.hostname)}" data-copy-label="Address copied"`}>Copy</button>
    </div>
    <p class="plate-foot">In Minecraft, go to Multiplayer, then Add Server, and paste this address. No port needed.<br>
      Reserved for later: <code>${esc(sv.custom_hostname)}</code> isn't live yet, so share the address above. <a href="#/help/branded">Why?</a></p>
  </section>`;
}

// Delegated handlers, attached once.
document.addEventListener("click", async e => {
  const c = e.target.closest("[data-copy]");
  if (c) return copyText(c.dataset.copy, c.dataset.copyLabel);
  const rn = e.target.closest("[data-renew]");
  if (rn) {
    rn.disabled = true; rn.textContent = "Renewing…";
    try { const sv = await api("POST", `/servers/${rn.dataset.renew}/renew`, undefined, keyFor(rn.dataset.renew)); toast(`Renewed until ${dateStr(sv.expires_at)}`); router(); }
    catch (err) { toast(err.message); rn.disabled = false; rn.textContent = "Renew server (30 days)"; }
    return;
  }
  const d = e.target.closest("[data-dl]");
  if (d) {
    d.disabled = true; const label = d.textContent; d.textContent = "Preparing…";
    try { const r = await api("POST", `/servers/${d.dataset.dl}/files`, undefined, keyFor(d.dataset.dl)); await saveDownload(r.download, t => d.textContent = t); toast("Download started"); }
    catch (err) { toast(err.message); }
    d.disabled = false; d.textContent = label;
  }
});

// ---------- nav ----------
function renderNav(route) {
  const cur = (...ps) => ps.some(p => route === p || route.startsWith(p + "/")) ? ' aria-current="page"' : "";
  $("nav").innerHTML = `
    <a href="#/servers"${cur("servers")}>My servers</a>
    <a href="#/help" class="hide-sm"${cur("help")}>Help</a>
    <a class="btn primary small" href="#/new">Create<span class="hide-sm"> server</span></a>`;
}

// ---------- router ----------
const routes = [
  [/^$/, viewLanding],
  [/^servers$/, viewMyServers],
  [/^new$/, viewCreate],
  [/^servers\/([a-f0-9]+)(\/setup|\/settings|\/mods)?$/, viewServer],
  [/^manage\/([a-f0-9]+)\/([a-f0-9]+)$/, openManageLink],
  [/^s\/([a-f0-9]+)$/, viewShare],
  [/^help(?:\/([a-z-]+))?$/, viewHelp],
];

async function router() {
  state.timers.forEach(clearInterval); state.timers = [];
  const route = location.hash.replace(/^#\/?/, "");
  renderNav(route);
  for (const [re, view] of routes) {
    const m = route.match(re);
    if (!m) continue;
    await view(...m.slice(1));
    if (!/^help\/./.test(route)) window.scrollTo(0, 0);
    return;
  }
  setTitle("Page not found");
  $app.innerHTML = `<div class="wrap narrow"><h1>Page not found</h1><p><a href="#/">Go to the home page</a></p></div>`;
}
window.addEventListener("hashchange", router);

// A manage link: check it, remember it on this device, then open the server.
// replace() keeps the secret key out of the browser's back-button history.
async function openManageLink(id, key) {
  $app.innerHTML = `<div class="wrap narrow"><p class="muted">Opening…</p></div>`;
  try {
    const sv = await api("GET", `/servers/${id}`, undefined, key);
    remember(id, key, sv.name);
    location.replace(`#/servers/${id}`);
  } catch (e) {
    setTitle("Link not valid");
    $app.innerHTML = `<div class="wrap narrow"><h1>This manage link doesn't work</h1>
      <p>${e.status === 404 ? "The server was deleted, or the link was copied incompletely. Check the full link in the README.txt inside the server's download." : esc(e.message)}</p>
      <a class="btn" href="#/servers">My servers</a></div>`;
  }
}

// ---------- landing ----------
function viewLanding() {
  setTitle("");
  const demo = { hostname: "mzf-fridaynight.play.minekube.net", custom_hostname: "fridaynight.mc.mzforge.com", status: "online" };
  const has = saved().length > 0;
  $app.innerHTML = `
  <div class="wrap">
    <section class="hero">
      <div>
        <h1>Your PC runs the server. We give it an address.</h1>
        <p class="lede">Free Minecraft Java servers without the queue, and without an account. MZForge runs the server on your own computer and tunnels it out, so friends can join from anywhere. No port forwarding.</p>
        <div class="cta-row">
          <a class="btn primary" href="#/new">Create a free server</a>
          ${has ? `<a class="btn ghost" href="#/servers">My servers</a>` : `<a class="btn ghost" href="#/help">Read how it works</a>`}
        </div>
      </div>

function wireAdd() {

  f.onsubmit = e => {

  };
}

// ----- recommendations -----
// Rough capacity per GB of heap, by server software. Deliberately
// conservative: exploring players and farms use more than idle ones.
const PLAYERS_PER_GB = { vanilla: 5, paper: 8, fabric: 6 };
const RAM_STEPS = [2048, 3072, 4096, 6144, 8192, 10240, 12288];
function recommendRam(loader, players, addons) {
  const gb = 1.5 + players / (PLAYERS_PER_GB[loader] || 5) + addons * 0.08;
  return RAM_STEPS.find(s => s >= gb * 1024) || 12288;
}
function comfortablePlayers(loader, ramMb, addons) {
  return Math.max(2, Math.floor((ramMb / 1024 - 1.5 - addons * 0.08) * (PLAYERS_PER_GB[loader] || 5)));
}
const gbLabel = mb => `${+(mb / 1024).toFixed(1)} GB`;

// ----- icon: any image -> 64x64 PNG (what Minecraft requires) -----
function resizeIcon(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Pick an image file (PNG, JPG, WebP, GIF)."));
    if (file.size > 15 * 1024 * 1024) return reject(new Error("That image is too big. Pick one under 15 MB."));
    // Read as a data: URL (the page's security policy allows data: images,
    // not blob: ones).
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that image."));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = c.height = 64;
        const ctx = c.getContext("2d"); ctx.imageSmoothingQuality = "high";
        const side = Math.min(img.width, img.height); // centre square crop
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 64, 64);
        resolve(c.toDataURL("image/png").split(",")[1]);
      };
      img.onerror = () => reject(new Error("Couldn't read that image. Try a PNG or JPG."));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const iconSrc = cfg => cfg.iconPNG ? `data:image/png;base64,${cfg.iconPNG}` : (cfg.icon_url && cfg.has_icon ? API + cfg.icon_url : DEFAULT_ICON);

// ----- MOTD: two lines, each with a colour -----
// Minecraft shows up to two lines under a server in the Multiplayer list.
// The website stores them as one motd string with colour codes and a
// newline, which is exactly what server.properties wants.
const MC_PALETTE = [
  ["f", "White", "#fff"], ["a", "Lime", "#5f5"], ["e", "Yellow", "#ff5"], ["6", "Gold", "#fa0"],
  ["b", "Aqua", "#5ff"], ["d", "Pink", "#f5f"], ["c", "Red", "#f55"], ["9", "Blue", "#55f"],
  ["2", "Green", "#0a0"], ["7", "Grey", "#aaa"],
];
// Splits a stored motd into { text, colour } per line.
function parseMotd(motd, fallbackName) {
  const lines = String(motd || "").split(/\n/).slice(0, 2);
  const out = lines.map(line => {
    const m = line.match(/^[&§]([0-9a-f])/i);
    return { colour: m ? m[1].toLowerCase() : "f", text: m ? line.slice(2) : line };
  });
  while (out.length < 2) out.push({ colour: out.length ? "7" : "f", text: "" });
  if (!out[0].text) out[0].text = fallbackName || "";
  return out;
}
function buildMotd(lines) {
  return lines.filter(l => l.text.trim()).map(l => `&${l.colour}${l.text}`).join("\n");
}

// ----- MOTD colours (preview) -----
const MC_COLORS = { 0: "#000", 1: "#00a", 2: "#0a0", 3: "#0aa", 4: "#a00", 5: "#a0a", 6: "#fa0", 7: "#aaa", 8: "#555", 9: "#55f", a: "#5f5", b: "#5ff", c: "#f55", d: "#f5f", e: "#ff5", f: "#fff" };
function motdPreviewHTML(text) {
  let out = "", style = { color: "#aaa" };
  const parts = String(text).split(/[&§]([0-9a-fk-or])/i);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const c = parts[i].toLowerCase();
      if (MC_COLORS[c]) style = { color: MC_COLORS[c] };
      else if (c === "l") style.bold = true;
      else if (c === "o") style.italic = true;
      else if (c === "n") style.underline = true;
      else if (c === "m") style.strike = true;
      else if (c === "r") style = { color: "#aaa" };
      continue;
    }
    if (!parts[i]) continue;
    const css = `color:${style.color};${style.bold ? "font-weight:700;" : ""}${style.italic ? "font-style:italic;" : ""}` +
      `${style.underline || style.strike ? `text-decoration:${style.underline ? "underline " : ""}${style.strike ? "line-through" : ""};` : ""}`;
    out += `<span style="${css}">${esc(parts[i])}</span>`;
  }
  return out;
}

function ramHint(cfg) {
  const addons = cfg.addons?.length || 0;
  const rec = recommendRam(cfg.loader, cfg.max_players, addons);
  const dev = navigator.deviceMemory ? ` This device reports at least ${navigator.deviceMemory} GB.` : "";
  const extra = addons ? `, ${addons} ${addonWord(cfg.loader, addons !== 1)}` : "";
  return `Recommended: ${gbLabel(rec)} for ${esc(loaderName(cfg.loader))} with ${esc(cfg.max_players)} players${esc(extra)}. Keep it under about 60% of your PC's total memory.${dev}`;
}
// Render distance is the single biggest lever on memory and lag.
function viewHint(cfg) {
  const v = cfg.view_distance ?? 10;
  const note = v >= 16 ? `<span class="warn-text">${v} chunks is demanding: expect noticeably more memory and lag with several players.</span>`
    : v <= 6 ? "Very light on your PC, but players see less around them."
    : "A good balance. Minecraft's own default is 10.";
  return `How far players can see, in chunks (3-32). ${note}`;
}
function playersHint(cfg) {
  const ok = comfortablePlayers(cfg.loader, cfg.ram_mb, cfg.addons?.length || 0);
  return cfg.max_players > ok
    ? `<span class="warn-text">${gbLabel(cfg.ram_mb)} comfortably handles about ${ok} players. Consider ${gbLabel(recommendRam(cfg.loader, cfg.max_players, cfg.addons?.length || 0))}.</span>`
    : `${gbLabel(cfg.ram_mb)} comfortably handles about ${ok} players on ${esc(loaderName(cfg.loader))}.`;
}

    <div class="hint" data-namemsg="${key}" aria-live="polite"></div>`;
}

// Wires the Basics form. onChange() redraws previews; values land in cfg.
function wireBasics(root, cfg, onChange) {
  const refreshHints = () => {

    root.querySelector("#b-maxhint").innerHTML = playersHint(cfg);
    const rec = recommendRam(cfg.loader, cfg.max_players, cfg.addons?.length || 0);
    root.querySelectorAll('[data-seg="ram"] button').forEach(b => {
      b.querySelector(".rec")?.remove();
      if (+b.dataset.v === rec) b.insertAdjacentHTML("beforeend", `<span class="rec">Recommended</span>`);
    });
    onChange();
  };
  wireSeg(root, "ram", v => {
    const box = root.querySelector(".custom-ram");
    cfg.ramTouched = true;
    if (v === "custom") { box.hidden = false; root.querySelector("#b-ramc").focus(); return; }

  root.querySelector("#b-ramc").oninput = e => {
    const gb = parseFloat(e.target.value);
    if (gb >= 1 && gb <= 32) { cfg.ram_mb = Math.round(gb * 4) * 256; cfg.ramTouched = true; refreshHints(); }
  };
  root.querySelector("#b-max").oninput = e => {
    const n = parseInt(e.target.value, 10);
    if (n >= 1 && n <= 500) {
      cfg.max_players = n;
      // Until someone picks memory themselves, memory follows the recommendation.
      if (!cfg.ramTouched) {
        cfg.ram_mb = recommendRam(cfg.loader, n, cfg.addons?.length || 0);
        root.querySelectorAll('[data-seg="ram"] button').forEach(b => b.setAttribute("aria-checked", String(+b.dataset.v === cfg.ram_mb)));
      }
      refreshHints();
    }
  };
  wireSeg(root, "pvp", v => { cfg.pvp = v === "true"; onChange(); });
  wireSeg(root, "gamemode", v => { cfg.gamemode = v; onChange(); });
  wireSeg(root, "difficulty", v => { cfg.difficulty = v; onChange(); });
  wireSeg(root, "whitelist", v => { cfg.whitelist = v === "true"; root.querySelector("#b-wl").hidden = !cfg.whitelist; onChange(); });
  wireSeg(root, "online", v => {
    cfg.online_mode = v === "true";
    root.querySelector('[data-seg="online"]').nextElementSibling.textContent = cfg.online_mode
      ? "Only players with a real Minecraft account can join. Recommended."
      : "Lets in players without a paid account. Anyone can join as any name, including yours, so use it only with people you trust and turn on the whitelist.";
    onChange();
  });
  root.querySelector("#b-port").oninput = e => { const n = parseInt(e.target.value, 10); if (n >= 1024 && n <= 65535) cfg.port = n; };
  const token = root.querySelector("#b-token");
  if (token) token.oninput = e => cfg.connect_token = e.target.value.trim();
  root.querySelector("#b-view").oninput = e => {
    const n = parseInt(e.target.value, 10);
    if (n >= 3 && n <= 32) { cfg.view_distance = n; root.querySelector("#b-viewhint").innerHTML = viewHint(cfg); onChange(); }
  };
  root.querySelector("#b-sim").oninput = e => {
    const n = parseInt(e.target.value, 10);
    if (n >= 3 && n <= 32) { cfg.simulation_distance = n; onChange(); }
  };
  for (const [key, field] of [["wl", "whitelist_players"], ["ops", "ops"]]) {
    const list = root.querySelector(`[data-names="${key}"]`), form = root.querySelector(`[data-addname="${key}"]`);
    const msg = root.querySelector(`[data-namemsg="${key}"]`);
    const draw = () => { list.innerHTML = cfg[field].map(n => `<li class="chip">${esc(n)} <button type="button" aria-label="Remove ${esc(n)}" data-rm="${esc(n)}">×</button></li>`).join(""); onChange(); };
    list.onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { cfg[field] = cfg[field].filter(n => n !== b.dataset.rm); draw(); } };
    // Not a <form>: these sit inside the wizard/settings form, and nested
    // forms are invalid (the browser would submit the outer one).
    const input = form.querySelector("input");
    input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addName(); } };
    form.querySelector("button").onclick = () => addName();
    const addName = async () => {
      const name = input.value.trim();
      if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) { msg.innerHTML = `<span class="bad-text">Minecraft names are 3-16 letters, numbers or _.</span>`; return; }
      if (cfg[field].some(n => n.toLowerCase() === name.toLowerCase())) { input.value = ""; return; }
      let final = name;
      if (cfg.online_mode) { // official accounts: check it exists, get the right capitalisation
        msg.textContent = "Checking…";
        try {
          const r = await api("GET", `/meta/player?name=${encodeURIComponent(name)}`);
          if (!r.found) { msg.innerHTML = `<span class="bad-text">${esc(sentence(r.reason))}</span>`; return; }
          final = r.name;
        } catch (err) { msg.innerHTML = `<span class="bad-text">${esc(err.message)}</span>`; return; }
      }
      msg.textContent = ""; input.value = ""; cfg[field].push(final); draw();
    };
  }
}

// ----- Add-on picker (popular picks + Modrinth search) -----
// ops: { has(projectId), add(projectId, info) -> Promise, remove(projectId) -> Promise }
async function compatibleVersion(loader, version, projectId) {
  const q = `loaders=${encodeURIComponent(JSON.stringify(MOD_LOADERS[loader]))}&game_versions=${encodeURIComponent(JSON.stringify([version]))}`;
  const res = await fetch(`${MODRINTH}/project/${encodeURIComponent(projectId)}/version?${q}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("Couldn't reach Modrinth. Try again in a moment.");
  const versions = await res.json();
  return versions[0] || null;
}
function pickerHTML(loader, version) {
  const what = addonWord(loader);
  return `
    <div class="picks-head"><span class="label">Popular picks</span>
      <button type="button" class="btn small ghost" id="p-recall">Add all recommended</button></div>
    <div class="picks" id="p-picks">${POPULAR[loader].map(p => `
      <label class="pick" data-slug="${p.slug}">
        <input type="checkbox" data-pick="${p.slug}">
        <span class="box" aria-hidden="true"></span>
        <span><b>${esc(p.title)}${p.rec ? ` <span class="rec">Recommended</span>` : ""}</b><span class="meta">${esc(p.desc)}</span></span>
      </label>`).join("")}</div>
    <div class="field" style="margin-top:22px"><label for="p-q">Search Modrinth</label>
      <div class="search-row" id="p-search"><input id="p-q" type="search" placeholder="Try: tpa, economy, shops, claims, backups…" autocomplete="off"><button type="button" class="btn">Search</button></div>
      <div class="hint">Only ${what} for ${esc(loaderName(loader))} ${esc(version)}${loader === "fabric" ? " that run on a server" : ""} are shown.</div></div>
    <ul class="mod-list" id="p-results" aria-live="polite"></ul>`;
}
function wirePicker(root, loader, version, ops) {
  const picks = root.querySelector("#p-picks");
  // Resolve popular picks to real Modrinth projects; grey out ones with no
  // build for this Minecraft version.
  const ids = {};
  const sync = () => picks.querySelectorAll("[data-pick]").forEach(cb => { const id = ids[cb.dataset.pick]; cb.checked = !!id && ops.has(id); });
  POPULAR[loader].forEach(async p => {
    const label = picks.querySelector(`[data-slug="${p.slug}"]`);
    try {
      const v = await compatibleVersion(loader, version, p.slug);
      if (!v) { label.classList.add("na"); label.querySelector("input").disabled = true; label.querySelector(".meta").textContent = `Not available for ${version} yet.`; return; }
      ids[p.slug] = v.project_id; label.dataset.version = v.id; sync();
    } catch { /* offline: leave clickable; adding will explain */ }
  });
  picks.onchange = async e => {
    const cb = e.target.closest("[data-pick]"); if (!cb) return;
    const p = POPULAR[loader].find(x => x.slug === cb.dataset.pick);
    cb.disabled = true;
    try {
      if (cb.checked) { const id = await ops.add(ids[p.slug] || p.slug, { title: p.title }); if (id) ids[p.slug] = id; }
      else await ops.remove(ids[p.slug] || p.slug);
    } catch (err) { toast(err.message); cb.checked = !cb.checked; }
    cb.disabled = false; sync();
  };
  root.querySelector("#p-recall").onclick = async e => {
    const b = e.currentTarget; b.disabled = true;
    for (const p of POPULAR[loader].filter(x => x.rec)) {
      const cb = picks.querySelector(`[data-pick="${p.slug}"]`);
      if (cb.disabled || cb.checked) continue;
      try { const id = await ops.add(ids[p.slug] || p.slug, { title: p.title }); if (id) ids[p.slug] = id; } catch (err) { toast(err.message); }
    }
    b.disabled = false; sync();
  };

  let lastQ = null;
  const results = root.querySelector("#p-results");
  const search = async q => {
    lastQ = q;
    const f = loader === "fabric"
      ? [["categories:fabric"], [`versions:${version}`], ["project_type:mod"], ["server_side:required", "server_side:optional"]]
      : [["categories:paper", "categories:spigot", "categories:bukkit"], [`versions:${version}`]];
    results.innerHTML = `<li class="muted">Searching…</li>`;
    let data;
    try {
      const res = await fetch(`${MODRINTH}/search?limit=15&index=relevance&query=${encodeURIComponent(q)}&facets=${encodeURIComponent(JSON.stringify(f))}`);
      if (!res.ok) throw 0; data = await res.json();
    } catch { if (lastQ === q) results.innerHTML = `<li class="muted">Couldn't reach Modrinth. Try again in a moment.</li>`; return; }
    if (lastQ !== q) return;
    const hits = data.hits || [];
    results.innerHTML = hits.length ? hits.map(h => modRowHTML(
      { title: h.title, icon_url: String(h.icon_url || "").startsWith("https://cdn.modrinth.com/") ? h.icon_url : "", sub: `${h.description} (${Number(h.downloads).toLocaleString()} downloads)` },
      ops.has(h.project_id) ? `<span class="muted small">Added</span>` : `<button type="button" class="btn small primary" data-add="${esc(h.project_id)}" data-title="${esc(h.title)}" data-icon="${esc(h.icon_url || "")}">Add</button>`
    )).join("") : `<li class="muted">Nothing found for ${esc(loaderName(loader))} ${esc(version)}.</li>`;
  };
  let t;
  root.querySelector("#p-q").oninput = e => { clearTimeout(t); const q = e.target.value.trim(); if (q.length >= 2) t = setTimeout(() => search(q), 400); };
  root.querySelector("#p-search button").onclick = () => search(root.querySelector("#p-q").value.trim());
  root.querySelector("#p-q").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); search(e.target.value.trim()); } };
  results.onclick = async e => {
    const b = e.target.closest("[data-add]"); if (!b) return;
    b.disabled = true; b.textContent = "Adding…";
    try {
      await ops.add(b.dataset.add, { title: b.dataset.title, icon_url: b.dataset.icon });
      b.replaceWith(Object.assign(document.createElement("span"), { className: "muted small", textContent: "Added" }));
      sync();
    } catch (err) { toast(err.message); b.disabled = false; b.textContent = "Add"; }
  };
  return { refresh: sync };
}
function modRowHTML(m, action) {
  const icon = m.icon_url ? `<img src="${esc(m.icon_url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=noicon></span>'">` : `<span class="noicon"></span>`;
  return `<li class="mod">${icon}<div><b>${esc(m.title)}</b><span class="meta">${esc(m.sub)}</span></div>${action}</li>`;
}

// ---------- create wizard ----------
// Adds a Modrinth project (newest build for this server) plus its required
// dependencies. Returns the project id added.
async function addToServer(sv, key, projectId, depth = 0) {
  const v = await compatibleVersion(sv.loader, sv.mc_version, projectId);
  if (!v) { if (depth === 0) throw new Error(`No version of that for ${loaderName(sv.loader)} ${sv.mc_version} yet.`); return null; }
  const r = await api("POST", `/servers/${sv.server_id}/mods`, { version_id: v.id }, key);
  sv.mods = r.mods;
  if (depth < 3) for (const dep of r.missing_dependencies) { try { await addToServer(sv, key, dep, depth + 1); } catch {} }
  return v.project_id;
}

    } else if (cfg.step === 3 && MOD_LOADERS[cfg.loader]) {
      const drawChips = () => {
        $("p-chips").innerHTML = cfg.addons.map(a => `<li class="chip">${esc(a.title)} <button type="button" aria-label="Remove ${esc(a.title)}" data-rm="${esc(a.project_id)}">×</button></li>`).join("") || `<li class="muted small">None yet.</li>`;
        $("p-count").textContent = cfg.addons.length; followRam(); updatePreview();
      };
      drawChips();
      const picker = wirePicker($("f"), cfg.loader, cfg.version, {
        has: id => cfg.addons.some(a => a.project_id === id),
        add: async (projectId, info) => {
          const v = await compatibleVersion(cfg.loader, cfg.version, projectId);
          if (!v) throw new Error(`No version of ${info.title || "that"} for ${loaderName(cfg.loader)} ${cfg.version} yet.`);
          if (!cfg.addons.some(a => a.project_id === v.project_id)) cfg.addons.push({ project_id: v.project_id, version_id: v.id, title: info.title || projectId });
          drawChips(); return v.project_id;
        },
        remove: async id => { cfg.addons = cfg.addons.filter(a => a.project_id !== id); drawChips(); },
      });
      $("p-chips").onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { cfg.addons = cfg.addons.filter(a => a.project_id !== b.dataset.rm); drawChips(); picker.refresh(); } };
    } else if (cfg.step === 4) {
      const acc = $("accept");
      acc.onchange = () => { cfg.accepted = acc.checked; $("next").disabled = !acc.checked; };
    }
  }

  function checkSlug(v, immediate) {
    cfg.slug = v; cfg.slugOK = false;
    const msg = $("slug-msg");
    clearTimeout(slugTimer); slugSeq++;
    $("slug-preview").innerHTML = previewAddr(v);
    if (!v) { msg.textContent = ""; return; }
    if (v.length < 3) { msg.innerHTML = `<span class="bad-text">Use at least 3 characters.</span>`; return; }
    msg.textContent = "Checking…";
    const seq = slugSeq;
    slugTimer = setTimeout(async () => {
      try {
        const r = await api("GET", "/slug-available?slug=" + encodeURIComponent(v));
        if (seq !== slugSeq) return;
        cfg.slugOK = r.available;
        msg.innerHTML = r.available ? `<span class="ok-text">Available.</span>` : `<span class="bad-text">${esc(sentence(r.reason))}</span>`;
      } catch (e) { if (seq === slugSeq) msg.innerHTML = `<span class="bad-text">${esc(e.message)}</span>`; }
    }, immediate ? 0 : 350);
  }

  async function onNext(e) {
    e.preventDefault();
    if (cfg.step === 0) {
      if (!cfg.slugOK) return formError(cfg.slug ? "Pick an available address name first." : "Enter an address name for your server.");
      cfg.step++; return draw();
    }
    if (cfg.step === 1) {
      if (!(cfg.max_players >= 1 && cfg.max_players <= 500)) return formError("Max players must be a whole number from 1 to 500.");
      if (cfg.whitelist && !cfg.whitelist_players.length && !cfg.ops.length) return formError("Whitelist is on but nobody is on it. Add at least one player (or yourself as an admin).");
    }
    if (cfg.step < 4) { cfg.step++; return draw(); }
    if (!cfg.accepted) return;

    const btn = $("next"); busy(btn, true, "Creating…");
    const name = cfg.name.trim() || cfg.slug;
    let r;
    try {
      r = await api("POST", "/allocate", { slug: cfg.slug, loader: cfg.loader, mc_version: cfg.version, eula_accepted: true, ...settingsPayload({ ...cfg, name }) });
    } catch (err) {
      if (err.status === 409) { cfg.step = 0; cfg.slugOK = false; draw(); }
      else busy(btn, false, "Create server and download");
      return formError(err.message);
    }
    remember(r.server_id, r.manage_key, name);
    const sv = { server_id: r.server_id, loader: cfg.loader, mc_version: cfg.version, mods: [] };
    if (cfg.iconPNG) {
      btn.textContent = "Saving icon…";
      try { await api("PUT", `/servers/${r.server_id}/icon`, { png: cfg.iconPNG }, r.manage_key); } catch (err) { toast("Icon: " + err.message); }
    }
    for (const [i, a] of cfg.addons.entries()) {
      btn.textContent = `Adding ${addonWord(cfg.loader)} ${i + 1} of ${cfg.addons.length}…`;
      try { await addToServer(sv, r.manage_key, a.project_id); } catch (err) { toast(`${a.title}: ${err.message}`); }
    }
    try {
      const files = await api("POST", `/servers/${r.server_id}/files`, undefined, r.manage_key);
      await saveDownload(files.download, t => btn.textContent = t);
    } catch (err) { toast(err.message); }
    location.hash = `#/servers/${r.server_id}/setup`;
  }
  draw();
}

// ---------- server page (managing) ----------
// Tabs: #/servers/{id} (overview), /settings, /mods. "/setup" = overview
// right after creation.
async function viewServer(id, tab) {
  tab = (tab || "").replace("/", "");
  const key = keyFor(id);
  if (!key) {
    setTitle("Manage link needed");
    $app.innerHTML = `<div class="wrap narrow"><h1>Manage link needed</h1>
      <p>This browser doesn't have this server's manage link. Open Renew-Server.url or the link in README.txt from the server's folder, or paste the link on <a href="#/servers">My servers</a>.</p>
      <a class="btn" href="#/s/${esc(id)}">View its status page</a></div>`;
    return;
  }
  $app.innerHTML = `<div class="wrap"><p class="muted">Loading…</p></div>`;
  let sv;
  try { sv = await api("GET", `/servers/${id}`, undefined, key); }
  catch (e) {
    setTitle("Server not found");
    $app.innerHTML = `<div class="wrap narrow"><h1>Server not found</h1><p>${e.status === 404 ? "It was deleted, or it expired and was removed. Its address is free again, so you can create a new server with the same name." : esc(e.message)}</p>
      <div class="cta-row">${e.status === 404 ? `<button class="btn" id="forget">Remove from my servers</button>` : ""}<a class="btn ghost" href="#/new">Create a server</a></div></div>`;
    const f = $("forget"); if (f) f.onclick = () => { forget(id); location.hash = "#/servers"; };
    return;
  }
  setTitle(sv.name);
  const setup = tab === "setup";
  const base = `#/servers/${id}`;
  const cur = t => (tab === t || (t === "" && setup)) ? ' aria-current="page"' : "";
  const exp = expiryInfo(sv);
  const renewBar = exp ? `
    <div class="renew-bar ${exp.level}" id="renewbar">
      <p>${esc(exp.text)}</p>
      <button class="btn ${exp.level === "expired" ? "danger" : exp.level === "warn" ? "primary" : ""}" data-renew="${esc(id)}">Renew server (30 days)</button>
    </div>` : "";

  let body;
  if (tab === "settings") body = settingsTabHTML(sv);
  else if (tab === "mods") body = modsTabHTML(sv);
  else body = await overviewTabHTML(sv, key, setup);

  $app.innerHTML = `
  <div class="wrap">
    <p class="small"><a href="#/servers">My servers</a></p>
    <div class="server-top"><img src="${esc(API + sv.icon_url)}" alt="" width="56" height="56" onerror="this.src='${DEFAULT_ICON}'"><h1 id="sname">${esc(sv.name)}</h1></div>
    ${setup ? `<div class="alert ok" role="status">Server created. Your download should have started. If it didn't, use Download again below.</div>` : ""}
    ${renewBar}
    <nav class="tabs" aria-label="Server sections">
      <a href="${base}"${cur("")}>Overview</a>
      <a href="${base}/settings"${cur("settings")}>Settings</a>
      <a href="${base}/mods"${cur("mods")}>${sv.loader === "fabric" ? "Mods" : sv.loader === "paper" ? "Plugins" : "Mods &amp; Plugins"}${sv.mods?.length ? ` (${sv.mods.length})` : ""}</a>
    </nav>
    ${body}
  </div>`;

  if (tab === "settings") wireSettings(sv, key);
  else if (tab === "mods") wireMods(sv, key);
  else wireOverview(sv, key);
}

async function overviewTabHTML(sv, key, setup) {
  const showSetup = setup || sv.status === "never_started";
  let jar = null;
  if (showSetup) { try { jar = await api("GET", `/meta/server-jar?loader=${sv.loader}&version=${encodeURIComponent(sv.mc_version)}`); } catch {} }
  const mURL = manageURL(sv.server_id, key);
  const keyPanel = `
    <section class="keybox ${setup ? "fresh" : ""}">
      <h2>${setup ? "Save your manage link" : "Manage link"}</h2>
      <p>There's no account. This link is how you get back to this page to renew, change settings, or delete the server, from any device. It's also in the download as Renew-Server.url. Anyone who has it can delete the server, so share the join address with friends, never this.</p>
      <div class="inline-form"><label class="sr-only" for="mlink">Manage link</label>
        <input id="mlink" type="text" readonly value="${esc(mURL)}"><button class="btn ${setup ? "primary" : ""}" data-copy="${esc(mURL)}" data-copy-label="Manage link copied">Copy link</button></div>
    </section>`;
  return `
    <div id="plate">${plateHTML(sv, { big: true })}</div>
    <p class="status-line muted" id="sdetail">${esc(detailText(sv))}</p>
    <ul class="facts">
      <li>Software <b>${esc(loaderName(sv.loader))} ${esc(sv.mc_version)}</b></li>
      <li>Created <b>${esc(dateStr(sv.created_at))}</b></li>
      <li>Address name <b>${esc(sv.slug)}</b></li>
    </ul>
    <div class="cta-row" style="margin-top:0">
      <button class="btn" data-dl="${esc(sv.server_id)}">Download again</button>
      <button class="btn ghost" data-copy="${esc(shareURL(sv.server_id))}" data-copy-label="Status page link copied">Copy status page link</button>
    </div>
    <p class="small muted" style="margin-top:10px">The status page is safe to share: friends can see whether the server is up, but can't change anything.</p>
    ${setup ? keyPanel : ""}
    ${showSetup ? setupHTML(sv, jar) : ""}
    ${setup ? "" : `<div class="panel">${keyPanel}</div>`}
    ${!showSetup ? `<details class="panel" id="moresetup"><summary class="label">Setup steps</summary><div id="setupbody"></div></details>` : ""}
    <p class="panel small"><button class="linkish" id="forgetme">Remove from this browser</button> <span class="muted">(doesn't delete the server)</span></p>`;
}
function detailText(s) { return statusInfo(s).detail + (s.status === "online" && s.live_version ? ` Running ${s.live_version}.` : ""); }

function wireOverview(sv, key) {
  const id = sv.server_id;
  $("forgetme").onclick = () => {
    if (confirm("Remove this server from this browser? You'll need its manage link to get back here. The server itself keeps working.")) { forget(id); location.hash = "#/servers"; }
  };
  const more = $("moresetup");
  if (more) more.addEventListener("toggle", async () => {
    if (!more.open || more.dataset.loaded) return;
    more.dataset.loaded = "1";
    let j = null;
    try { j = await api("GET", `/meta/server-jar?loader=${sv.loader}&version=${encodeURIComponent(sv.mc_version)}`); } catch {}
    $("setupbody").innerHTML = setupHTML(sv, j, false);
  });
  every(15000, async () => {
    try {
      const n = await api("GET", `/servers/${id}`, undefined, key);
      if (!$("plate") || !location.hash.startsWith(`#/servers/${id}`)) return;
      if (!$("plate").contains(document.activeElement)) $("plate").innerHTML = plateHTML(n, { big: true });
      $("sdetail").textContent = detailText(n);
    } catch {}
  });
}

// ----- Settings tab -----
function cfgFromServer(sv) {
  return { ...sv, version: sv.mc_version, addons: sv.mods || [], iconPNG: "", ramTouched: true,
    whitelist_players: [...(sv.whitelist_players || [])], ops: [...(sv.ops || [])] };
}
function settingsTabHTML(sv) {
  const cfg = cfgFromServer(sv);
  return `
    <div class="wiz-layout">
      <div>
        <form class="card" id="settings" novalidate>
          <div id="err"></div>
          <h2>Appearance</h2>
          ${appearanceHTML(cfg)}
          <h2 class="panel">Basics</h2>
          ${basicsHTML(cfg)}
          <p class="hint">Saved here, then applied by MZForgeLauncher.exe the next time it starts: restart the launcher to apply them to a running server. Game mode applies to new players; existing players keep theirs.</p>
          <button class="btn primary" id="s-save">Save settings</button>
        </form>
        <section class="danger-zone panel">
          <h2>Delete server</h2>
          <p class="muted small">The launcher from this download stops working, and the address <b>mzf-${esc(sv.slug)}</b> is retired for good: nobody can use it again, including you. World files on your PC aren't touched.</p>
          <form id="del"><label class="label" for="confirm">Type ${esc(sv.slug)} to confirm</label>
            <div class="inline-form"><input id="confirm" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"><button class="btn danger" id="delbtn" disabled>Delete server</button></div></form>
        </section>
      </div>
      <div id="preview-slot">${previewCardHTML(cfg)}</div>
    </div>`;
}
function wireSettings(sv, key) {
  const id = sv.server_id, cfg = cfgFromServer(sv), form = $("settings");
  const updatePreview = () => { $("preview-slot").innerHTML = previewCardHTML(cfg); };
  wireAppearance(form, cfg, updatePreview, async png => {
    const r = png ? await api("PUT", `/servers/${id}/icon`, { png }, key) : await api("DELETE", `/servers/${id}/icon`, undefined, key);
    cfg.has_icon = r.has_icon; cfg.icon_url = r.icon_url;
    toast(png ? "Icon saved" : "Back to the MZForge icon");
  });
  wireBasics(form, cfg, updatePreview);
  form.onsubmit = async e => {
    e.preventDefault();
    if (!(cfg.max_players >= 1 && cfg.max_players <= 500)) return formError("Max players must be a whole number from 1 to 500.");
    const btn = $("s-save"); busy(btn, true, "Saving…");
    try {
      const r = await api("PATCH", `/servers/${id}`, settingsPayload(cfg), key);
      remember(id, key, r.name); $("sname").textContent = r.name; setTitle(r.name);
      formError(""); toast("Settings saved. Restart the launcher to apply them.");
    } catch (err) { formError(err.message); }
    busy(btn, false, "Save settings");
  };
  const confirmI = $("confirm"), delbtn = $("delbtn");
  confirmI.oninput = () => delbtn.disabled = confirmI.value.trim() !== sv.slug;
  $("del").onsubmit = async e => {
    e.preventDefault();
    if (confirmI.value.trim() !== sv.slug) return;
    busy(delbtn, true, "Deleting…");
    try { await api("DELETE", `/servers/${id}`, undefined, key); forget(id); toast("Server deleted"); location.hash = "#/servers"; }
    catch (err) { toast(err.message); busy(delbtn, false, "Delete server"); }
  };
}

// ----- Mods & Plugins tab -----
function modsTabHTML(sv) {
  if (!MOD_LOADERS[sv.loader]) {
    return `<div class="empty"><h2>Vanilla doesn't run mods or plugins</h2>
      <p class="muted">This server uses Vanilla Minecraft. For plugins, create a Paper server; for mods, a Fabric server. You can copy your world folder across to the new server.</p>
      <a class="btn primary" href="#/new">Create a server</a></div>`;
  }
  const what = addonWord(sv.loader);
  return `
    <section>
      <h2>Installed ${what} <span class="muted small">(<span id="m-count">${sv.mods.length}</span>)</span></h2>
      <ul class="mod-list" id="installed"></ul>
      <p class="hint">New ${what} are downloaded by MZForgeLauncher.exe the next time it starts, and included when you use Download again. Removing one here doesn't delete it from your PC: delete the file from the <b>${esc(sv.mods_folder)}</b> folder too.</p>
    </section>
    <section class="card panel">
      <h2>Add ${what}</h2>
      ${pickerHTML(sv.loader, sv.mc_version)}
    </section>`;
}
function wireMods(sv, key) {
  if (!MOD_LOADERS[sv.loader]) return;
  const what = addonWord(sv.loader);
  const drawInstalled = () => {
    $("installed").innerHTML = sv.mods.length ? sv.mods.map(m => modRowHTML(
      { title: m.title, icon_url: m.icon_url, sub: `${m.version_number} (${m.filename})` },
      `<button class="btn small ghost" data-remove="${esc(m.project_id)}">Remove</button>`)).join("")
      : `<li class="muted">No ${what} yet. Pick some below.</li>`;
    $("m-count").textContent = sv.mods.length;
    const tab = document.querySelector(`.tabs a[href$="/mods"]`);
    if (tab) tab.textContent = `${what[0].toUpperCase() + what.slice(1)}${sv.mods.length ? ` (${sv.mods.length})` : ""}`;
  };
  drawInstalled();
  const remove = async projectId => {
    const r = await api("DELETE", `/servers/${sv.server_id}/mods/${projectId}`, undefined, key);
    sv.mods = r.mods; drawInstalled(); picker.refresh();
    toast(`Removed. Also delete its file from your ${sv.mods_folder} folder.`);
  };
  const picker = wirePicker(document, sv.loader, sv.mc_version, {
    has: id => sv.mods.some(m => m.project_id === id),
    add: async projectId => {
      const before = sv.mods.length;
      const id = await addToServer(sv, key, projectId);
      drawInstalled();
      const extra = sv.mods.length - before - 1;
      toast(extra > 0 ? `Added, plus ${extra} it needs` : "Added");
      return id;
    },
    remove,
  });
  $("installed").onclick = async e => {
    const b = e.target.closest("[data-remove]"); if (!b) return;
    b.disabled = true;
    try { await remove(b.dataset.remove); } catch (err) { toast(err.message); b.disabled = false; }
  };
}

  return `

    <ol class="setup">
      <li><h3>Unzip the download</h3><p>Extract mzforge-${esc(sv.slug)}.zip into its own folder, such as Documents\\MZForge\\${esc(sv.slug)}. Your world gets saved there, so don't run it from inside the ZIP or your Downloads preview.</p></li>
      <li><h3>Double-click MZForgeLauncher.exe</h3>
        <p>That's the whole setup. On the first run it downloads the official ${esc(loaderName(sv.loader))} ${esc(sv.mc_version)} server file from ${esc(source)}, and ${esc(java)} if this PC doesn't have it. Later runs start straight away.</p>
        <p>Windows may warn about an unrecognized app the first time: choose <span class="kbd">More info</span>, then <span class="kbd">Run anyway</span>. Keep the window open. When it says SERVER ONLINE, this page turns green.</p></li>
      <li><h3>Send friends the address above</h3><p>They add it under Multiplayer. <a href="#/help/troubleshooting">Something not working?</a></p></li>
    </ol>
