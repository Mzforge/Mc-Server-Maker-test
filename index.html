<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#161B26">
<title>MZForge — free Minecraft servers that run on your own PC</title>
<meta name="description" content="Create a Minecraft Java server in a minute, no account needed. It runs on your PC, so there's no queue and no player cap. We give it an address your friends can join.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23161B26'/><rect x='3' y='3' width='10' height='10' fill='%23F4C95D'/><rect x='5' y='5' width='6' height='6' fill='%23161B26'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #161B26;
  --surface: #1F2634;
  --raised: #283043;
  --line: #36405A;
  --text: #ECEAE3;
  --muted: #9AA2B5;
  --glow: #F4C95D;
  --glow-ink: #2A2106;
  --online: #5FD6B8;
  --danger: #EE6A5F;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 6px;
  --measure: 68ch;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0 0 .5em; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 5.2vw, 3.4rem); font-weight: 700; }
h2 { font-size: clamp(1.45rem, 3vw, 1.9rem); }
h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; max-width: var(--measure); }
a { color: var(--glow); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code { font-family: var(--display); font-weight: 600; }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { position: fixed; left: 12px; top: 12px; width: auto; height: auto; clip: auto; z-index: 100; background: var(--glow); color: var(--glow-ink); padding: 8px 12px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 720px; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

/* header */
.top { position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top, 0px); background: rgba(22,27,38,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 1.2rem var(--display); color: var(--text); text-decoration: none; margin-right: auto; }
.brand-mark { width: 22px; height: 22px; background: var(--glow); box-shadow: inset 0 0 0 5px var(--glow), inset 0 0 0 11px var(--bg); }
.nav { display: flex; gap: 4px; align-items: center; }
.nav a:not(.btn) { color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: var(--r); font-family: var(--display); font-weight: 600; }
.nav a:not(.btn):hover, .nav a[aria-current="page"] { color: var(--text); background: var(--surface); }

/* buttons */
.btn {
  --b: var(--raised); --c: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--r);
  background: var(--b); color: var(--c); font: 600 1rem var(--display);
  text-decoration: none; cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { box-shadow: inset 0 2px 0 rgba(0,0,0,.3); transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.btn.primary { --b: var(--glow); --c: var(--glow-ink); }
.btn.danger { --b: var(--danger); --c: #2B0906; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .92rem; }
.btn.block { width: 100%; }

main { flex: 1; padding: 40px 0 80px; }
main:focus { outline: none; }

/* The join-address plate: the most important thing on the site.
   Styled like an inventory slot: light top-left bevel, dark bottom-right. */
.plate {
  background: var(--surface); border-radius: 4px; padding: 20px;
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.07), inset -3px -3px 0 rgba(0,0,0,.35), 0 0 0 1px var(--line);
}
.plate-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.plate-caption { color: var(--muted); font-size: .95rem; }
.addr-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.addr {
  flex: 1 1 320px; min-width: 0;
  background: var(--bg); border-radius: 3px; padding: 14px 16px;
  box-shadow: inset 3px 3px 0 rgba(0,0,0,.45), inset -2px -2px 0 rgba(255,255,255,.05);
  font: 700 clamp(1.15rem, 3.6vw, 2.1rem)/1.2 var(--display); color: var(--text);
  overflow-wrap: break-word; user-select: all; letter-spacing: .01em;
}
.plate.big .addr { font-size: clamp(1.3rem, 5vw, 2.7rem); padding: 20px; }
.addr-row .btn { min-width: 112px; min-height: 56px; }
.plate-foot { margin: 14px 0 0; font-size: .92rem; color: var(--muted); }
.plate-foot code { color: var(--text); overflow-wrap: anywhere; }

/* status */
.status { display: inline-flex; align-items: center; gap: 8px; font: 600 .95rem var(--display); }
.dot { width: 10px; height: 10px; border-radius: 2px; background: var(--muted); flex: none; }
.status.online { color: var(--online); } .status.online .dot { background: var(--online); box-shadow: 0 0 0 4px rgba(95,214,184,.18); }
.status.offline { color: var(--muted); }
.status.never_started { color: var(--glow); } .status.never_started .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--glow); }

/* landing */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; padding: 24px 0 72px; }
.hero h1 { max-width: 14ch; }
.hero .lede { font-size: 1.2rem; color: var(--muted); max-width: 44ch; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.demo .plate { transform: rotate(-1.2deg); }
.demo .addr { font-size: clamp(1.1rem, 2.3vw, 1.55rem); flex-basis: 100%; }
.demo .addr-row .btn { display: none; }
.demo-chat { margin: 18px 0 0 auto; max-width: 300px; background: var(--raised); border-radius: 14px 14px 4px 14px; padding: 12px 14px; font-size: .95rem; transform: rotate(1deg); }
.demo-chat b { font-family: var(--display); color: var(--glow); }
.section { padding: 56px 0; border-top: 1px solid var(--line); }
.steps { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; counter-reset: s; }
.steps li { counter-increment: s; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 14px; font: 700 1.2rem var(--display); color: var(--glow-ink); background: var(--glow); border-radius: 4px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.25); }
.steps p { color: var(--muted); font-size: .98rem; }
.tradeoff { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 12px; }
.tradeoff ul { padding-left: 1.1em; margin: 0; }
.tradeoff li { margin-bottom: .7em; max-width: 48ch; }
.tradeoff li::marker { color: var(--glow); }
.tradeoff .needs li::marker { color: var(--muted); }

/* forms */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
.field { margin-bottom: 18px; }
.field label, .label { display: block; font: 600 .95rem var(--display); margin-bottom: 6px; }
.hint { color: var(--muted); font-size: .88rem; margin-top: 6px; }
input[type=text], input[type=email], input[type=password], select {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r);
  background: var(--bg); color: var(--text); border: 1px solid var(--line); font: 1rem var(--body);
}
input:focus, select:focus { border-color: var(--glow); outline: none; box-shadow: 0 0 0 3px rgba(244,201,93,.25); }
.slug-input { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); overflow: hidden; }
.slug-input:focus-within { border-color: var(--glow); box-shadow: 0 0 0 3px rgba(244,201,93,.25); }
.slug-input input { border: 0; box-shadow: none !important; min-width: 0; }
.slug-input span { display: flex; align-items: center; padding: 0 12px; color: var(--muted); background: var(--surface); white-space: nowrap; font: 600 1rem var(--display); }
.addr-preview { margin-top: 10px; font-size: .95rem; color: var(--muted); }
.addr-preview code { color: var(--text); font-size: 1.05rem; overflow-wrap: break-word; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--glow); flex: none; }
.alert { padding: 12px 14px; border-radius: var(--r); margin-bottom: 18px; font-size: .95rem; }
.alert.error { background: rgba(238,106,95,.12); color: #FFB3AC; box-shadow: inset 3px 0 0 var(--danger); }
.alert.info { background: rgba(244,201,93,.1); box-shadow: inset 3px 0 0 var(--glow); }
.alert.ok { background: rgba(95,214,184,.1); box-shadow: inset 3px 0 0 var(--online); }
.ok-text { color: var(--online); } .bad-text { color: #FFB3AC; }
.form-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; font-size: .95rem; }

/* dashboard */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.page-head h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0; }
.server-list { display: grid; gap: 14px; }
.server-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
}
.server-row h2 { font-size: 1.25rem; margin: 0; overflow-wrap: anywhere; }
.server-row h2 a { color: var(--text); text-decoration: none; }
.server-row h2 a:hover { color: var(--glow); }
.server-row .meta { color: var(--muted); font-size: .9rem; }
.row-addr { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-addr code { font-size: 1.05rem; color: var(--text); background: var(--bg); padding: 8px 12px; border-radius: 4px; overflow-wrap: anywhere; flex: 1 1 260px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.row-note { grid-column: 1 / -1; }
.empty { padding: 40px; border: 2px dashed var(--line); border-radius: 10px; }

/* wizard */
.wizard-steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 28px; }
.wizard-steps li { flex: 1; font: 600 .82rem var(--display); color: var(--muted); padding-top: 10px; border-top: 4px solid var(--line); }
.wizard-steps li[aria-current="step"] { color: var(--text); border-color: var(--glow); }
.wizard-steps li.done { border-color: rgba(244,201,93,.45); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; }
.choice label { display: block; height: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
.choice label b { display: block; font: 700 1.1rem var(--display); margin-bottom: 4px; }
.choice label span { color: var(--muted); font-size: .9rem; }
.choice input:checked + label { border-color: var(--glow); box-shadow: inset 0 0 0 1px var(--glow); }
.choice input:focus-visible + label { outline: 3px solid var(--glow); outline-offset: 2px; }
.eula-box { max-height: 280px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; font-size: .92rem; white-space: pre-wrap; margin-bottom: 16px; }
.review { display: grid; grid-template-columns: max-content 1fr; gap: 10px 24px; margin: 0 0 20px; }
.review dt { color: var(--muted); } .review dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.wizard-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }

/* server page */
.server-top h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 18px; overflow-wrap: anywhere; }
.status-line { margin: 14px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 28px 0; padding: 0; list-style: none; color: var(--muted); font-size: .95rem; }
.facts b { color: var(--text); }
.panel { margin-top: 44px; }
.panel h2 { font-size: 1.3rem; }
details.panel summary { cursor: pointer; }
.setup { list-style: none; padding: 0; margin: 0; counter-reset: k; }
.setup > li { counter-increment: k; position: relative; padding: 0 0 22px 52px; }
.setup > li::before { content: counter(k); position: absolute; left: 0; top: -2px; width: 34px; height: 34px; display: grid; place-items: center; font: 700 1rem var(--display); background: var(--raised); color: var(--glow); border-radius: 4px; }
.setup > li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 38px; bottom: 4px; width: 2px; background: var(--line); }
.setup h3 { margin: 4px 0 6px; }
.setup p { color: var(--muted); }
.keybox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.keybox.fresh { margin-top: 36px; border-color: var(--glow); box-shadow: inset 4px 0 0 var(--glow); }
.keybox h2 { font-size: 1.3rem; }
.keybox input { font-family: var(--display); font-size: .92rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--glow); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.danger-zone { border: 1px solid rgba(238,106,95,.5); border-radius: 10px; padding: 22px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; }
.inline-form input { flex: 1 1 200px; }

/* docs */
.docs { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
.docs nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; }
.docs nav a { display: block; color: var(--muted); text-decoration: none; padding: 6px 0; }
.docs nav a:hover { color: var(--text); }
.docs article section { margin-bottom: 48px; }
.docs ol, .docs ul { max-width: var(--measure); padding-left: 1.3em; }
.docs li { margin-bottom: .5em; }
.kbd { font: 600 .9em var(--display); background: var(--raised); padding: 1px 6px; border-radius: 3px; }

footer { border-top: 1px solid var(--line); padding: 28px 0 36px; color: var(--muted); font-size: .88rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer a { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 6px; font: 600 .95rem var(--display); transition: .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .hero, .tradeoff, .two { grid-template-columns: 1fr; gap: 36px; }
  .steps { grid-template-columns: 1fr 1fr; }
  .docs { grid-template-columns: 1fr; gap: 20px; }
  .docs nav { position: static; display: flex; flex-wrap: wrap; gap: 0 16px; }
}
@media (max-width: 600px) {
  body { font-size: 16px; }
  main { padding-top: 24px; }
  .steps, .choices { grid-template-columns: 1fr; }
  .nav .hide-sm { display: none; }
  .card { padding: 20px; }
  .addr-row .btn { width: 100%; }
  .plate.big .addr { font-size: 1.5rem; padding: 16px; }
  .server-row { grid-template-columns: 1fr; }
  .wizard-steps li { font-size: 0; }
  .wizard-steps li::after { content: attr(data-n); font-size: .82rem; }
  .wizard-steps li[aria-current="step"]::after { content: attr(data-label); }
  .demo .plate, .demo-chat { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

</header>

    <span><a href="#/help">Help</a></span>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// Where the MZForge API lives. "" = same origin (the API serves this page).
// If you host this file somewhere else, set it to e.g. "https://api.mzforge.com".
const API = "";

const LOADERS = {
  vanilla: { name: "Vanilla", blurb: "The game exactly as Mojang ships it." },
  paper:   { name: "Paper",   blurb: "Faster, and runs Bukkit and Paper plugins." },
  fabric:  { name: "Fabric",  blurb: "Lightweight, for Fabric mods." },
};

const $app = document.getElementById("app");
const state = { timers: [] };
const $ = id => document.getElementById(id);

// ---------- servers saved on this device ----------
// There are no accounts. Each server has a secret manage key; this browser
// remembers the ones created or opened here. The same link is in the
// README.txt inside every download, so it's never only stored here.
const STORE_KEY = "mzforge.servers.v1";
function saved() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function saveAll(list) { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch {} }
function remember(id, key, name) { const l = saved().filter(x => x.id !== id); l.unshift({ id, key, name }); saveAll(l); }
function forget(id) { saveAll(saved().filter(x => x.id !== id)); }
function keyFor(id) { return saved().find(x => x.id === id)?.key || ""; }
function manageURL(id, key) { return `${location.origin}${location.pathname}#/manage/${id}/${key}`; }
function shareURL(id) { return `${location.origin}${location.pathname}#/s/${id}`; }

// ---------- helpers ----------
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// Break long hostnames after dots so they wrap cleanly on phones.
function addrHTML(host) { return esc(host).replace(/\./g, ".<wbr>"); }

async function api(method, path, body, key) {
  const opts = { method, headers: {} };
  if (key) opts.headers["X-Manage-Key"] = key;
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { throw new Error("Can't reach MZForge right now. Check your connection and try again."); }
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch { /* not JSON */ }
  if (!res.ok) {
    // No JSON body on a 404/405 means something other than the MZForge API
    // answered, e.g. this file is being served by a static host.
    const msg = data?.error ? sentence(data.error)
      : [404, 405, 501].includes(res.status)
        ? "This page can't reach the MZForge API. Open the site through the API server, or set API at the top of index.html."
        : `Request failed (${res.status}).`;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return data;
}
function sentence(s) { return s ? s[0].toUpperCase() + s.slice(1) + (/[.!?]$/.test(s) ? "" : ".") : s; }

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2000);
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(label || "Copied");
}
function ago(iso) {
  if (!iso || iso.startsWith("0001")) return null;
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const h = Math.round(s / 3600); if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(s / 86400); if (d < 30) return `${d} day${d === 1 ? "" : "s"} ago`;
  return new Date(iso).toLocaleDateString();
}

// ---------- building the download ----------
// The launcher exe is a static file next to this page; the API sends the
// server's config files, and the ZIP is put together here in the browser.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// Minimal ZIP writer (stored, no compression; the exe barely compresses anyway).
function makeZip(entries) {
  const enc = new TextEncoder(), d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const { name, data } of entries) {
    const nameBytes = enc.encode(name), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2], [14, crc, 4],
     [18, data.length, 4], [22, data.length, 4], [26, nameBytes.length, 2], [28, 0, 2]]
      .forEach(([o, v, n]) => n === 4 ? local.setUint32(o, v, true) : local.setUint16(o, v, true));
    parts.push(local, nameBytes, data);
    const cen = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2], [16, crc, 4],
     [20, data.length, 4], [24, data.length, 4], [28, nameBytes.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2],
     [36, 0, 2], [38, 0, 4], [42, offset, 4]]
      .forEach(([o, v, n]) => n === 4 ? cen.setUint32(o, v, true) : cen.setUint16(o, v, true));
    central.push(cen, nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const cdSize = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, entries.length, 2], [10, entries.length, 2], [12, cdSize, 4], [16, offset, 4], [20, 0, 2]]
    .forEach(([o, v, n]) => n === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}
let launcherBytes = null;
async function saveDownload(dl) {
  if (!launcherBytes) {
    let res;
    try { res = await fetch("MZForgeLauncher.exe"); } catch { res = null; }
    if (!res || !res.ok) throw new Error("Couldn't load MZForgeLauncher.exe. Check it's in the same folder as index.html on the site.");
    launcherBytes = new Uint8Array(await res.arrayBuffer());
  }
  const enc = new TextEncoder();
  const entries = Object.entries(dl.files).map(([name, text]) => ({ name, data: enc.encode(text) }));
  entries.push({ name: "MZForgeLauncher.exe", data: launcherBytes });
  const url = URL.createObjectURL(makeZip(entries));
  const a = document.createElement("a");
  a.href = url; a.download = dl.filename;
  document.body.appendChild(a); a.click(); a.remove();

}

}

function statusInfo(sv) {

    online: ["Online", "Friends can join now."],
    offline: ["Offline", last ? `Last online ${last}. It comes back when MZForgeLauncher.exe is running on the host PC.` : "Not running right now."],
    never_started: ["Not started yet", "Run MZForgeLauncher.exe on your PC to bring it online."],

// ---------- nav ----------
function renderNav(route) {
  const cur = (...ps) => ps.some(p => route === p || route.startsWith(p + "/")) ? ' aria-current="page"' : "";
  $("nav").innerHTML = `
    <a href="#/servers"${cur("servers")}>My servers</a>
    <a href="#/help" class="hide-sm"${cur("help")}>Help</a>
    <a class="btn primary small" href="#/new">Create server</a>`;
}

// ---------- router ----------
const routes = [
  [/^$/, viewLanding],
  [/^servers$/, viewMyServers],
  [/^new$/, viewCreate],
  [/^servers\/([a-f0-9]+)(\/setup)?$/, viewServer],
  [/^manage\/([a-f0-9]+)\/([a-f0-9]+)$/, openManageLink],
  [/^s\/([a-f0-9]+)$/, viewShare],
  [/^help(?:\/([a-z-]+))?$/, viewHelp],
];

async function router() {
  state.timers.forEach(clearInterval); state.timers = [];
  const route = location.hash.replace(/^#\/?/, "");
  renderNav(route);
  for (const [re, view] of routes) {
    const m = route.match(re);
    if (!m) continue;
    await view(...m.slice(1));
    if (!/^help\/./.test(route)) window.scrollTo(0, 0);
    return;
  }
  setTitle("Page not found");
  $app.innerHTML = `<div class="wrap narrow"><h1>Page not found</h1><p><a href="#/">Go to the home page</a></p></div>`;
}
window.addEventListener("hashchange", router);

// A manage link: check it, remember it on this device, then open the server.
// replace() keeps the secret key out of the browser's back-button history.
async function openManageLink(id, key) {
  $app.innerHTML = `<div class="wrap narrow"><p class="muted">Opening…</p></div>`;

    const sv = await api("GET", `/servers/${id}`, undefined, key);

    setTitle("Link not valid");
    $app.innerHTML = `<div class="wrap narrow"><h1>This manage link doesn't work</h1>

      <a class="btn" href="#/servers">My servers</a></div>`;
  }
}

async function viewCreate() {
  setTitle("Create a server");
  const w = { step: 0, name: "", slug: "", slugEdited: false, slugOK: false, loader: "paper", version: "", versions: [], eula: null, accepted: false };
  $app.innerHTML = `<div class="wrap narrow"><p class="muted">Loading…</p></div>`;
  try {
    const [v, e] = await Promise.all([api("GET", "/meta/versions"), api("GET", "/meta/eula")]);
    w.versions = v.versions; w.version = v.versions[0]; w.eula = e;
  } catch (err) { $app.innerHTML = `<div class="wrap narrow"><div class="alert error">${esc(err.message)}</div></div>`; return; }

  const STEPS = ["Name", "Software", "EULA", "Create"];
  let slugTimer, slugSeq = 0;
  function previewHTML(v) {

    if (v.length < 3) { msg.innerHTML = `<span class="bad-text">Use at least 3 characters.</span>`; return; }
    msg.textContent = "Checking…";
    const seq = slugSeq;
    slugTimer = setTimeout(async () => {
      try {
        const r = await api("GET", "/slug-available?slug=" + encodeURIComponent(v));
        if (seq !== slugSeq) return;

        msg.innerHTML = r.available ? `<span class="ok-text">Available.</span>` : `<span class="bad-text">${esc(sentence(r.reason))}</span>`;

  async function onNext(e) {

      w.step++; return draw();
    }
    if (w.step === 1) { w.step++; return draw(); }
    if (w.step === 2) { if (w.accepted) { w.step++; draw(); } return; }
    const btn = $("next"); busy(btn, true, "Creating…");
    try {
      const name = w.name.trim() || w.slug;
      const r = await api("POST", "/allocate", { slug: w.slug, name, loader: w.loader, mc_version: w.version, eula_accepted: w.accepted });
      remember(r.server_id, r.manage_key, name);
      btn.textContent = "Preparing download…";
      try { await saveDownload(r.download); } catch (e) { toast(e.message); }
      location.hash = `#/servers/${r.server_id}/setup`;
    } catch (err) {
      if (err.status === 409) { w.step = 0; w.slugOK = false; draw(); }
      else busy(btn, false, "Create server and download");
      formError(err.message);
    }
  }
  draw();
}

// ---------- server page (managing) ----------
async function viewServer(id, setup) {
  const key = keyFor(id);
  if (!key) {
    setTitle("Manage link needed");
    $app.innerHTML = `<div class="wrap narrow"><h1>Manage link needed</h1>
      <p>This browser doesn't have this server's manage link. Open the link from the README.txt in the server's download, or paste it on <a href="#/servers">My servers</a>.</p>
      <a class="btn" href="#/s/${esc(id)}">View its status page</a></div>`;
    return;
  }
  $app.innerHTML = `<div class="wrap"><p class="muted">Loading…</p></div>`;
  let sv;
  try { sv = await api("GET", `/servers/${id}`, undefined, key); }
  catch (e) {
    setTitle("Server not found");
    $app.innerHTML = `<div class="wrap narrow"><h1>Server not found</h1><p>${e.status === 404 ? "It was deleted, or the saved manage link no longer works." : esc(e.message)}</p>
      <div class="cta-row">${e.status === 404 ? `<button class="btn" id="forget">Remove from my servers</button>` : ""}<a class="btn ghost" href="#/servers">My servers</a></div></div>`;
    const f = $("forget"); if (f) f.onclick = () => { forget(id); location.hash = "#/servers"; };
    return;
  }
  setTitle(sv.name);
  const showSetup = !!setup || sv.status === "never_started";
  let jar = null;
  if (showSetup) { try { jar = await api("GET", `/meta/server-jar?loader=${sv.loader}&version=${encodeURIComponent(sv.mc_version)}`); } catch {} }

  const mURL = manageURL(id, key);
  const detailText = s => statusInfo(s).detail + (s.status === "online" && s.live_version ? ` Running ${s.live_version}.` : "");
  const keyPanel = `
    <section class="keybox ${setup ? "fresh" : ""}">
      <h2>${setup ? "Save your manage link" : "Manage link"}</h2>
      <p>There's no account. This link is how you get back to this page to rename, re-download, or delete the server, from any device. Anyone who has it can delete the server, so share the join address with friends, never this.</p>
      <div class="inline-form"><label class="sr-only" for="mlink">Manage link</label>
        <input id="mlink" type="text" readonly value="${esc(mURL)}"><button class="btn ${setup ? "primary" : ""}" data-copy="${esc(mURL)}" data-copy-label="Manage link copied">Copy link</button></div>
      <p class="hint">Also saved in this browser, and written in README.txt inside the download.</p>
    </section>`;

  $app.innerHTML = `
  <div class="wrap">
    <p class="small"><a href="#/servers">My servers</a></p>
    <div class="server-top"><h1 id="sname">${esc(sv.name)}</h1></div>
    ${setup ? `<div class="alert ok" role="status">Server created. Your download should have started. If it didn't, use Download again below.</div>` : ""}
    <div id="plate">${plateHTML(sv, { big: true })}</div>
    <p class="status-line muted" id="sdetail">${esc(detailText(sv))}</p>

    <ul class="facts">
      <li>Software <b>${esc(loaderName(sv.loader))} ${esc(sv.mc_version)}</b></li>
      <li>Created <b>${esc(dateStr(sv.created_at))}</b></li>
      <li>Address name <b>${esc(sv.slug)}</b></li>
    </ul>
    <div class="cta-row" style="margin-top:0">
      <button class="btn" data-dl="${esc(sv.server_id)}">Download again</button>
      <button class="btn ghost" data-copy="${esc(shareURL(sv.server_id))}" data-copy-label="Status page link copied">Copy status page link</button>
    </div>
    <p class="small muted" style="margin-top:10px">The status page is safe to share: friends can see whether the server is up, but can't change anything.</p>

    ${setup ? keyPanel : ""}
    ${showSetup ? setupHTML(sv, jar) : ""}

    <div class="panel two">
      <section>
        <h2>Rename</h2>
        <form class="inline-form" id="rename"><label class="sr-only" for="newname">Server name</label>
          <input id="newname" type="text" maxlength="48" value="${esc(sv.name)}"><button class="btn">Save name</button></form>
        <p class="hint">Only changes the name shown on MZForge. The join address stays the same.</p>
      </section>
      <section class="danger-zone">
        <h2>Delete server</h2>
        <p class="muted small">The launcher from this download stops working, and the address <b>mzf-${esc(sv.slug)}</b> is retired for good: nobody can use it again, including you. World files on your PC aren't touched.</p>
        <form id="del"><label class="label" for="confirm">Type ${esc(sv.slug)} to confirm</label>
          <div class="inline-form"><input id="confirm" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"><button class="btn danger" id="delbtn" disabled>Delete server</button></div></form>
      </section>
    </div>
    ${setup ? "" : `<div class="panel">${keyPanel}</div>`}
    ${!showSetup ? `<details class="panel" id="moresetup"><summary class="label">Setup steps</summary><div id="setupbody"></div></details>` : ""}
    <p class="panel small"><button class="linkish" id="forgetme">Remove from this browser</button> <span class="muted">(doesn't delete the server)</span></p>
  </div>`;

  $("rename").onsubmit = async e => {
    e.preventDefault();
    try { const r = await api("PATCH", `/servers/${id}`, { name: $("newname").value }, key); $("sname").textContent = r.name; setTitle(r.name); remember(id, key, r.name); toast("Name saved"); }
    catch (err) { toast(err.message); }
  };
  const confirmI = $("confirm"), delbtn = $("delbtn");
  confirmI.oninput = () => delbtn.disabled = confirmI.value.trim() !== sv.slug;
  $("del").onsubmit = async e => {
    e.preventDefault();
    if (confirmI.value.trim() !== sv.slug) return;
    busy(delbtn, true, "Deleting…");
    try { await api("DELETE", `/servers/${id}`, undefined, key); forget(id); toast("Server deleted"); location.hash = "#/servers"; }
    catch (err) { toast(err.message); busy(delbtn, false, "Delete server"); }
  };
  $("forgetme").onclick = () => {
    if (confirm("Remove this server from this browser? You'll need its manage link to get back here. The server itself keeps working.")) { forget(id); location.hash = "#/servers"; }
  };
  const more = $("moresetup");
  if (more) more.addEventListener("toggle", async () => {
    if (!more.open || more.dataset.loaded) return;
    more.dataset.loaded = "1";
    let j = null;
    try { j = await api("GET", `/meta/server-jar?loader=${sv.loader}&version=${encodeURIComponent(sv.mc_version)}`); } catch {}
    $("setupbody").innerHTML = setupHTML(sv, j, false);
  });

  every(15000, async () => {
    try {
      const n = await api("GET", `/servers/${id}`, undefined, key);
      if (!location.hash.startsWith(`#/servers/${id}`)) return;
      if (!$("plate").contains(document.activeElement)) $("plate").innerHTML = plateHTML(n, { big: true });
      $("sdetail").textContent = detailText(n);
    } catch {}
  });
}

function setupHTML(sv, jar, withHeading = true) {
  const java = jar?.java || "the Java version your Minecraft version needs";
  let jarStep;
  if (jar?.direct_url) {
    jarStep = `<p>Download the official Minecraft ${esc(sv.mc_version)} server file from Mojang. It's already named server.jar. Put it in the same folder as MZForgeLauncher.exe.</p>
      <a class="btn" href="${esc(jar.direct_url)}" rel="noopener">Download server.jar from Mojang</a>`;
  } else if (jar) {
    jarStep = `<p>${esc(jar.instruction)}</p><a class="btn" href="${esc(jar.page_url)}" target="_blank" rel="noopener">Open ${esc(jar.source_name)} downloads</a>`;
  } else {
    jarStep = `<p>Download the ${esc(loaderName(sv.loader))} ${esc(sv.mc_version)} server jar from its official site, rename it to server.jar, and put it next to MZForgeLauncher.exe. <a href="#/help/server-jar">Where to get it</a></p>`;
  }
  return `
  <section class="${withHeading ? "panel" : ""}">
    ${withHeading ? "<h2>Get it running</h2>" : ""}
    <ol class="setup">
      <li><h3>Unzip the download</h3><p>Extract mzforge-${esc(sv.slug)}.zip into its own folder, such as Documents\\MZForge\\${esc(sv.slug)}. Your world gets saved there, so don't run it from inside the ZIP or your Downloads preview.</p></li>
      <li><h3>Add server.jar</h3>${jarStep}</li>
      <li><h3>Install ${esc(java)}</h3><p>Skip this if you already have it. The free Temurin build from Adoptium works well.</p>
        <a class="btn ghost" href="https://adoptium.net/temurin/releases/" target="_blank" rel="noopener">Open Adoptium</a></li>
      <li><h3>Double-click MZForgeLauncher.exe</h3><p>Windows may warn about an unrecognized app the first time. Choose <span class="kbd">More info</span>, then <span class="kbd">Run anyway</span>. Keep the window open. When it says SERVER ONLINE, this page turns green.</p></li>
      <li><h3>Send friends the address above</h3><p>They add it under Multiplayer. <a href="#/help/troubleshooting">Something not working?</a></p></li>
    </ol>
  </section>`;
}

// ---------- public status page ----------
async function viewShare(id) {
  $app.innerHTML = `<div class="wrap narrow"><p class="muted">Loading…</p></div>`;
  let data;
  try { data = await api("GET", `/status?server_id=${id}`); }
  catch {
    setTitle("Server not found");
    $app.innerHTML = `<div class="wrap narrow"><h1>Server not found</h1><p>This link doesn't point to a server anymore. Ask whoever sent it for a new one.</p></div>`;
    return;
  }
  const mine = !!keyFor(id);
  const draw = d => {
    const sv = d.server, last = ago(sv.last_seen);
    setTitle(sv.name);
    const line = sv.status === "online" ? "The server is up right now."
      : sv.status === "never_started" ? "This server hasn't been started yet."
      : `It's offline. It runs on its owner's PC, so it's up whenever they have MZForge open.${last ? ` Last online ${last}.` : ""}`;
    return `
    <div class="wrap narrow">
      <h1>${esc(sv.name)}</h1>
      <p class="muted">${esc(loaderName(sv.loader))} ${esc(sv.mc_version)}. Join with the same Minecraft version.</p>
      ${plateHTML(sv, { big: true, caption: "Join address" })}
      <p class="status-line muted">${esc(line)} This page checks again every 20 seconds.</p>
      ${mine ? `<p><a href="#/servers/${esc(sv.server_id)}">Manage this server</a></p>`
             : `<p class="small muted" style="margin-top:36px">Want your own? <a href="#/">MZForge</a> gives you a free server that runs on your PC. No account needed.</p>`}
    </div>`;
  };
  $app.innerHTML = draw(data);
  every(20000, async () => {
    try { const d = await api("GET", `/status?server_id=${id}`); if (location.hash === `#/s/${id}` && !$app.contains(document.activeElement)) $app.innerHTML = draw(d); } catch {}
  });
}

// ---------- help ----------
function viewHelp(anchor) {
  setTitle("Help");
  const toc = [
    ["how", "How MZForge works"], ["manage", "No account? How managing works"], ["needs", "What you need"], ["server-jar", "Getting server.jar"],
    ["java", "Java"], ["running", "Running your server"], ["antivirus", "Windows and antivirus warnings"],
    ["troubleshooting", "Friends can't join"], ["branded", "The .mc.mzforge.com address"], ["world", "Your world and backups"],
  ];
  $app.innerHTML = `
  <div class="wrap">
    <h1>Help</h1>
    <div class="docs">
      <nav aria-label="Help topics">${toc.map(([id, t]) => `<a href="#/help/${id}">${t}</a>`).join("")}</nav>
      <article>
        <section id="h-how"><h2>How MZForge works</h2>
          <p>Your Minecraft server runs on your own computer, not on ours. MZForgeLauncher.exe starts it and opens an outgoing connection to <a href="https://connect.minekube.com" target="_blank" rel="noopener">Minekube Connect</a>, a free tunnel network. Players join through Minekube's address, and the traffic comes through that tunnel to your PC.</p>
          <p>Because nothing runs on our side, this website can't start, stop, or restart your server, and it has no console or file access. It gives you the address and the launcher, and shows whether the server is up.</p></section>

        <section id="h-manage"><h2>No account? How managing works</h2>
          <p>MZForge doesn't have accounts. When you create a server, you get a <b>manage link</b>. It's the key to that server: whoever has it can rename it, download it again, or delete it.</p>
          <ul>
            <li>The browser you created it in remembers it, so it shows up under My servers.</li>
            <li>It's also written in the README.txt inside the download, so as long as you have the server folder, you have the link.</li>
            <li>To manage from another device (your phone, say), open the link there, or paste it on My servers.</li>
          </ul>
          <p>Don't share the manage link. Friends only need the join address, or the status page link if they want to check whether the server is up.</p>
          <p>Lost both the link and the folder? There's no way to recover it, because there's no account to recover. The server keeps working for anyone who has the launcher folder; you just can't manage it from the website.</p></section>

        <section id="h-needs"><h2>What you need</h2>
          <ul>
            <li>A Windows PC. The launcher gives Minecraft up to 4 GB of memory, so 8 GB of RAM or more in total is comfortable.</li>
            <li>Java, matched to your Minecraft version (see below).</li>
            <li>The server.jar file for the software you picked.</li>
            <li>A steady internet connection. Upload speed matters most.</li>
          </ul></section>

        <section id="h-server-jar"><h2>Getting server.jar</h2>
          <p>The download doesn't include server.jar. We don't redistribute Mojang's server software; you get it directly from the people who make it. It's a one-time step per server, and your server page links to the right place for your version.</p>
          <ul>
            <li><b>Vanilla:</b> the official file from Mojang. Your server page links straight to the exact version, already named server.jar.</li>
            <li><b>Paper:</b> from <a href="https://papermc.io/downloads/paper" target="_blank" rel="noopener">papermc.io</a>. Pick your version, download it, and rename the file to server.jar. Plugins go in a folder called plugins.</li>
            <li><b>Fabric:</b> from <a href="https://fabricmc.net/use/server/" target="_blank" rel="noopener">fabricmc.net</a>. Choose your Minecraft version, download the executable server jar, and rename it to server.jar. Mods go in a folder called mods.</li>
          </ul>
          <p>Put server.jar in the same folder as MZForgeLauncher.exe. If the launcher says it can't find server.jar, check the file isn't actually named server.jar.jar. Windows hides file extensions by default; turn on File name extensions in File Explorer's View menu to see them.</p></section>

        <section id="h-java"><h2>Java</h2>
          <p>Minecraft 1.20.5 and newer need Java 21. Versions 1.18 to 1.20.4 need Java 17, and older versions generally need Java 8. Your server page shows the exact one for your server.</p>
          <p>The free <a href="https://adoptium.net/temurin/releases/" target="_blank" rel="noopener">Temurin build from Adoptium</a> is a good choice. During install, turn on the option that adds Java to PATH. If the launcher window closes right away, or mentions an unsupported class version, you have the wrong Java version.</p></section>

        <section id="h-running"><h2>Running your server</h2>
          <ol>
            <li>Double-click MZForgeLauncher.exe. The first start takes longer while Minecraft generates the world.</li>
            <li>Wait for SERVER ONLINE. The launcher checks the public address itself before it says so.</li>
            <li>Leave the window open. Closing it saves the world and takes the server offline.</li>
          </ol>
          <p>If your PC goes to sleep, the server stops responding. For long sessions, change the sleep setting in Windows Settings, under System, then Power, while you're hosting.</p>
          <p>Run one copy at a time. The launcher refuses to start twice.</p></section>

        <section id="h-antivirus"><h2>Windows and antivirus warnings</h2>
          <p>MZForgeLauncher.exe is new and not yet code-signed, so Windows SmartScreen may say "Windows protected your PC". Choose <span class="kbd">More info</span>, then <span class="kbd">Run anyway</span>. Some antivirus tools flag unsigned programs that open network connections; you can add an exception for your MZForge folder.</p>
          <p>Only run a launcher you downloaded yourself from MZForge. If you're unsure about a copy, delete the folder and use Download again from your server's page.</p>
          <p>If Windows Firewall asks about Java, allowing it on private networks is fine. No port forwarding or router setup is needed, because the tunnel connects outward.</p></section>

        <section id="h-troubleshooting"><h2>Friends can't join</h2>
          <ul>
            <li><b>Your server page says Offline.</b> The launcher isn't running, the PC is asleep, or it lost its internet connection. Start the launcher again.</li>
            <li><b>It says Online, but a friend can't connect.</b> Check they pasted the full address and are on the same Minecraft version as the server.</li>
            <li><b>"Outdated client" or "Outdated server".</b> Their game version doesn't match. They can pick a version in the Minecraft Launcher's Installations tab.</li>
            <li><b>The launcher says the public address isn't answering.</b> Wait a minute and restart the launcher. Minekube's network occasionally takes a moment to register a new server.</li>
            <li><b>A friend plays Bedrock</b> (phone, console, or the Windows Bedrock app). MZForge servers are Java Edition only for now.</li>
          </ul></section>

        <section id="h-branded"><h2>The .mc.mzforge.com address</h2>
          <p>Each server reserves a name like yourname.mc.mzforge.com. It's set up on our side but isn't live yet: Minekube currently needs a manual step for every custom domain, and there's no way for us to automate it. We're working with them on that.</p>
          <p>Until then, share the address that starts with mzf- and ends in play.minekube.net. It works today and will keep working. When the branded address goes live, you won't need to change anything or download again.</p></section>

        <section id="h-world"><h2>Your world and backups</h2>
          <p>Everything lives in the folder you unzipped: the world, settings, plugins, and mods. To back it up, stop the launcher and copy the folder. Deleting a server on this site doesn't touch those files.</p>
          <p>Keep mzforge.properties and README.txt private. One holds the secret that identifies your server to MZForge, the other holds your manage link.</p></section>
      </article>
    </div>
  </div>`;
  if (anchor) $("h-" + anchor)?.scrollIntoView();
}

router();
